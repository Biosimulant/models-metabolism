schema_version: '2.0'
title: Bruck2008_Glycolysis Visualisation
description: Dedicated presentation model for Bruck2008_Glycolysis.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Bruck2008_Glycolysis Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Bruck2008_Glycolysis?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_bruck2008_glycolysis_model1011010000_model
      title: Bruck2008_Glycolysis
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: intracellular_glucose
        label: Intracellular Glucose
        maps_to: GLCi
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: G6P
      - id: fructose_6_phosphate
        label: Fructose 6 Phosphate
        maps_to: F6P
      - id: fructose_1_6_bisphosphate
        label: Fructose 1 6 Bisphosphate
        maps_to: F16P
      - id: triose_phosphate
        label: Triose Phosphate
        maps_to: TRIO
      - id: nadh
        label: NADH
        maps_to: NADH
      - id: nad
        label: NAD
        maps_to: NAD
      - id: observable_1_3_bisphosphoglycerate
        label: 1 3 Bisphosphoglycerate
        maps_to: BPG
      - id: observable_3_phosphoglycerate
        label: 3 Phosphoglycerate
        maps_to: P3G
      - id: observable_2_phosphoglycerate
        label: 2 Phosphoglycerate
        maps_to: P2G
      - id: phosphoenolpyruvate
        label: Phosphoenolpyruvate
        maps_to: PEP
      - id: pyruvate
        label: Pyruvate
        maps_to: PYR
      - id: acetaldehyde
        label: Acetaldehyde
        maps_to: ACE
      - id: glycolysis_state_14
        label: Glycolysis state 14
        maps_to: GLY
      - id: atp
        label: ATP
        maps_to: ATP
      - id: adp
        label: ADP
        maps_to: ADP
      - id: amp
        label: AMP
        maps_to: AMP
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_bruck2008_glycolysis_model1011010000_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_bruck2008_glycolysis_model1011010000_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_bruck2008_glycolysis_model1011010000_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
