schema_version: '2.0'
title: Bruck2008_Glycolysis
description: 'Exploring the effect of variable enzyme concentrations in a kinetic model of
  yeast glycolysis Jozsef Bruck, Wolfram Liebermeister, Edda Klipp, Genome Inform 2008 20:1-14
  Abstract: Metabolism is one of. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- "J\xF3zsef Bruck"
- Wolfram Liebermeister
- Edda Klipp
upstream:
  id: biomodels_ebi:MODEL1011010000
  source_db: biomodels_ebi
  source_id: MODEL1011010000
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1011010000
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1011010000?filename=MODEL1011010000_url.xml
  license: CC0
biosim:
  entrypoint: src.bruck2008_glycolysis_model1011010000_model:Bruck2008GlycolysisModel1011010000Model
  init_kwargs:
    model_path: data/MODEL1011010000.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_intracellular_glucose
    maps_to: GLCi
    default: 0.087
    units: native SBML value
    description: Initial condition for intracellular glucose. Maps to bundled SBML symbol
      `GLCi`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 1.39
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: F6P
    default: 0.28
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `F6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_1_6_bisphosphate
    maps_to: F16P
    default: 0.1
    units: native SBML value
    description: Initial condition for fructose 1 6 bisphosphate. Maps to bundled SBML symbol
      `F16P`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_triose_phosphate
    maps_to: TRIO
    default: 5.17
    units: native SBML value
    description: Initial condition for triose phosphate. Maps to bundled SBML symbol `TRIO`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: intracellular_glucose
    maps_to: GLCi
    label: Intracellular Glucose
    description: Intracellular Glucose. Maps to SBML symbol `GLCi`.
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: fructose_6_phosphate
    maps_to: F6P
    label: Fructose 6 Phosphate
    description: Fructose 6 Phosphate. Maps to SBML symbol `F6P`.
  - name: fructose_1_6_bisphosphate
    maps_to: F16P
    label: Fructose 1 6 Bisphosphate
    description: Fructose 1 6 Bisphosphate. Maps to SBML symbol `F16P`.
  - name: triose_phosphate
    maps_to: TRIO
    label: Triose Phosphate
    description: Triose Phosphate. Maps to SBML symbol `TRIO`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
