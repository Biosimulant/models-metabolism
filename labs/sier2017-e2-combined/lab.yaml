schema_version: '2.0'
title: Sier2017_E2_combined Lab
description: Using scaling from PhysB modelBlood flow in L/hrCompartments in KgBaseline as
  ~0.003nM Free E2 in Blood_venous E2 biosynthesis rate constant = 2 E2 biosynthesis species
  = 1nMCLeh = 5CLint = metabolic. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.initial_metabolic_pathway_state_1
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `Faeces`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.initial_metabolic_pathway_state_2
    default: 3001.00000000002
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `count`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.initial_metabolic_pathway_state_3
    default: -2999.00000000002
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `default_0`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.initial_metabolic_pathway_state_4
    default: 0.0209437464725829
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `s16`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.initial_metabolic_pathway_state_5
    default: 39.4491907670147
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `s18`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.metabolic_pathway_state_2
  - name: metabolic_pathway_state_3
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.metabolic_pathway_state_3
  - name: metabolic_pathway_state_4
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.metabolic_pathway_state_4
  - name: metabolic_pathway_state_5
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.metabolic_pathway_state_5
  - name: observable_values
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_sier2017_e2_combined_model1711210002_model.observable_labels
models:
- alias: metabolism_sbml_sier2017_e2_combined_model1711210002_model
  path: models/core
  parameters:
    model_path: data/MODEL1711210002.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_sier2017_e2_combined_model1711210002_model.observable_values
  to:
  - visualisation.metabolism_sbml_sier2017_e2_combined_model1711210002_model_observable_values
- from: metabolism_sbml_sier2017_e2_combined_model1711210002_model.run_summary
  to:
  - visualisation.metabolism_sbml_sier2017_e2_combined_model1711210002_model_run_summary
- from: metabolism_sbml_sier2017_e2_combined_model1711210002_model.observable_labels
  to:
  - visualisation.metabolism_sbml_sier2017_e2_combined_model1711210002_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
