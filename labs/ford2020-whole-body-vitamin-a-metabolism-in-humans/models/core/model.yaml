schema_version: '2.0'
title: Ford2020 - whole-body vitamin A metabolism in humans
description: Metabolism Ford2020Whole Body Vitamin AMetabolism In Huma Model2312190001Model
  captures core biological behavior in the context of metabolism, sbml, biomodels_ebi using
  a biomodels_ebi-sourced OTHER model. When you run it, you can observe state and evaluate
  how the modeled system changes across runs.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Jennifer Lynn Ford
- Joanne Balmer Green
- Marjorie J Haskell
- Shaikh M Ahmad
- "Dora In\xE9s Mazariegos Cordero"
upstream:
  id: biomodels_ebi:MODEL2312190001
  source_db: biomodels_ebi
  source_id: MODEL2312190001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2312190001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2312190001?filename=ford20.xml
  license: CC0
biosim:
  entrypoint: src.ford2020_whole_body_vitamin_a_metabolism_in_huma_model2312190001_model:Ford2020WholeBodyVitaminAMetabolismInHumaModel2312190001Model
  init_kwargs:
    model_path: data/MODEL2312190001.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_vitamin_a_metabolism_state_1
    maps_to: M_4
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 1. Maps to bundled SBML
      symbol `M_4`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_2
    maps_to: M_5
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 2. Maps to bundled SBML
      symbol `M_5`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_3
    maps_to: M_6
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 3. Maps to bundled SBML
      symbol `M_6`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_4
    maps_to: M_7
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 4. Maps to bundled SBML
      symbol `M_7`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_5
    maps_to: M_4_0
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 5. Maps to bundled SBML
      symbol `M_4_0`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: vitamin_a_metabolism_state_1
    maps_to: M_4
    label: Vitamin A Metabolism state 1
    description: Vitamin A Metabolism state 1; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `M_4`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: vitamin_a_metabolism_state_2
    maps_to: M_5
    label: Vitamin A Metabolism state 2
    description: Vitamin A Metabolism state 2; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `M_5`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: vitamin_a_metabolism_state_3
    maps_to: M_6
    label: Vitamin A Metabolism state 3
    description: Vitamin A Metabolism state 3; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `M_6`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: vitamin_a_metabolism_state_4
    maps_to: M_7
    label: Vitamin A Metabolism state 4
    description: Vitamin A Metabolism state 4; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `M_7`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: vitamin_a_metabolism_state_5
    maps_to: M_4_0
    label: Vitamin A Metabolism state 5
    description: Vitamin A Metabolism state 5; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `M_4_0`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
