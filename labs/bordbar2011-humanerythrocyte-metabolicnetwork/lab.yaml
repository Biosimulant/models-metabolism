title: Bordbar2011_HumanErythrocyte_MetabolicNetwork Lab
description: 'This model is from the article: iAB-RBC-283: A proteomically derived knowledge-base
  of erythrocyte metabolism that can be used to simulate its physiological and patho-physiological
  states. It can be used to explore metabolic flux dynamics and compare pathway behavior across
  conditions.'
