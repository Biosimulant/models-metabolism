schema_version: '2.0'
title: Wolf2000 - Cellular interaction on glycolytic oscillations in yeast
description: Wolf2000 - Cellular interaction on glycolyticoscillations in yeast A two-cell
  model of glycolysis. It can be used to explore metabolic flux dynamics and compare pathway
  behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Jana Wolf
- R Heinrich
upstream:
  id: biomodels_ebi:BIOMD0000000691
  source_db: biomodels_ebi
  source_id: BIOMD0000000691
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000691
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000691?filename=BIOMD0000000691_url.xml
  license: CC0
biosim:
  entrypoint: src.wolf2000_cellular_interaction_on_glycolytic_osci_biomd0000000691_model:Wolf2000CellularInteractionOnGlycolyticOsciBiomd0000000691Model
  init_kwargs:
    model_path: data/BIOMD0000000691.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glycolysis_state_1
    maps_to: S1__Cell_1_
    default: 5.8
    units: native SBML value
    description: Initial condition for glycolysis state 1. Maps to bundled SBML symbol `S1__Cell_1_`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_2
    maps_to: S1__Cell_2_
    default: 2.9
    units: native SBML value
    description: Initial condition for glycolysis state 2. Maps to bundled SBML symbol `S1__Cell_2_`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_3
    maps_to: S2__Cell_1_
    default: 0.9
    units: native SBML value
    description: Initial condition for glycolysis state 3. Maps to bundled SBML symbol `S2__Cell_1_`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_4
    maps_to: S2__Cell_2_
    default: 0.45
    units: native SBML value
    description: Initial condition for glycolysis state 4. Maps to bundled SBML symbol `S2__Cell_2_`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_5
    maps_to: S3__Cell_1_
    default: 0.2
    units: native SBML value
    description: Initial condition for glycolysis state 5. Maps to bundled SBML symbol `S3__Cell_1_`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: glycolysis_state_1
    maps_to: S1__Cell_1_
    label: Glycolysis state 1
    description: Glycolysis state 1; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `S1__Cell_1_`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: glycolysis_state_2
    maps_to: S1__Cell_2_
    label: Glycolysis state 2
    description: Glycolysis state 2; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `S1__Cell_2_`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: glycolysis_state_3
    maps_to: S2__Cell_1_
    label: Glycolysis state 3
    description: Glycolysis state 3; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `S2__Cell_1_`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: glycolysis_state_4
    maps_to: S2__Cell_2_
    label: Glycolysis state 4
    description: Glycolysis state 4; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `S2__Cell_2_`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: glycolysis_state_5
    maps_to: S3__Cell_1_
    label: Glycolysis state 5
    description: Glycolysis state 5; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `S3__Cell_1_`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
