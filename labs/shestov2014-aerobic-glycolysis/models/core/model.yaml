schema_version: '2.0'
title: Shestov2014 - aerobic glycolysis
description: Metabolism Shestov2014Aerobic Glycolysis Model1504010000Model models metabolism
  shestov2014 aerobic glycolysis model1504010000 dynamics as a OTHER simulation curated from
  biomodels_ebi (biomodels_ebi:MODEL15040. When you run it, you can track state over time
  and compare response patterns across parameter settings.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Alexander A Shestov
- Xiaojing Liu
- Zheng Ser
- Ahmad A Cluntun
- Yin P Hung
upstream:
  id: biomodels_ebi:MODEL1504010000
  source_db: biomodels_ebi
  source_id: MODEL1504010000
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1504010000
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1504010000?filename=MODEL1504010000_url.xml
  license: CC0
biosim:
  entrypoint: src.shestov2014_aerobic_glycolysis_model1504010000_model:Shestov2014AerobicGlycolysisModel1504010000Model
  init_kwargs:
    model_path: data/MODEL1504010000.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glycolysis_state_1
    maps_to: GLU
    default: 2.5909
    units: native SBML value
    description: Initial condition for glycolysis state 1. Maps to bundled SBML symbol `GLU`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 0.2263
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: F6P
    default: 0.0701
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `F6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_bisphosphate
    maps_to: FBP
    default: 0.45
    units: native SBML value
    description: Initial condition for fructose bisphosphate. Maps to bundled SBML symbol
      `FBP`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_5
    maps_to: DHAP
    default: 0.0244
    units: native SBML value
    description: Initial condition for glycolysis state 5. Maps to bundled SBML symbol `DHAP`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: glycolysis_state_1
    maps_to: GLU
    label: Glycolysis state 1
    description: Glycolysis state 1; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `GLU`. Exact metabolite identity is not encoded in the
      bundled SBML metadata.
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: fructose_6_phosphate
    maps_to: F6P
    label: Fructose 6 Phosphate
    description: Fructose 6 Phosphate. Maps to SBML symbol `F6P`.
  - name: fructose_bisphosphate
    maps_to: FBP
    label: Fructose Bisphosphate
    description: Fructose Bisphosphate. Maps to SBML symbol `FBP`.
  - name: glycolysis_state_5
    maps_to: DHAP
    label: Glycolysis state 5
    description: Glycolysis state 5; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `DHAP`. Exact metabolite identity is not encoded in the
      bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
