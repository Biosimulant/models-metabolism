schema_version: '2.0'
package: costa2015-central-metabolism-of-e-coli-extended-regulat-02d4c2cf
version: 1.0.0
title: Costa2015 - Central metabolism of E. coli, extended regulated linlog model ( with additional
  allosteric regulations than the Model1) Lab
description: Metabolism Costa2015Central Metabolism Of EColi Extended Model1504080006Model
  models core biological dynamics as a OTHER simulation curated from biomodels_ebi (biomodels_ebi:MODEL1504080006),
  focused on metabol. When you run it, you can track state over time and compare response
  patterns across parameter settings.
io:
  inputs:
  - name: initial_phosphoenol_pyruvate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.initial_phosphoenol_pyruvate
    default: 2.67
    units: native SBML value
    description: Initial condition for phosphoenol pyruvate. Maps to bundled SBML symbol `cpep`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_extracellular_glucose
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.initial_extracellular_glucose
    default: 0.0556
    units: native SBML value
    description: Initial condition for extracellular glucose. Maps to bundled SBML symbol
      `cglcex`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.initial_glucose_6_phosphate
    default: 3.48
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `cg6p`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_microbial_metabolism_state_4
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.initial_microbial_metabolism_state_4
    default: 2.67
    units: native SBML value
    description: Initial condition for microbial metabolism state 4. Maps to bundled SBML
      symbol `cpyr`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.initial_fructose_6_phosphate
    default: 0.6
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `cf6p`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: phosphoenol_pyruvate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.phosphoenol_pyruvate
  - name: extracellular_glucose
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.extracellular_glucose
  - name: glucose_6_phosphate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.glucose_6_phosphate
  - name: microbial_metabolism_state_4
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.microbial_metabolism_state_4
  - name: fructose_6_phosphate
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.fructose_6_phosphate
  - name: observable_values
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.observable_labels
models:
- alias: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model
  path: models/core
  parameters:
    model_path: data/MODEL1504080006.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.observable_values
  to:
  - visualisation.metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model_observable_values
- from: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.run_summary
  to:
  - visualisation.metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model_run_summary
- from: metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model.observable_labels
  to:
  - visualisation.metabolism_sbml_costa2015_central_metabolism_of_e_coli_extended_model1504080006_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
