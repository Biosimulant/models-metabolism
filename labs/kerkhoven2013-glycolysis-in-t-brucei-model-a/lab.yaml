schema_version: '2.0'
title: Kerkhoven2013 - Glycolysis in T.brucei - MODEL A Lab
description: Kerkhoven2013 - Glycolysis in T.brucei - MODEL A There are six models (Model
  A, B, C, C-fruc, D, D-fruc) described in the paper. Model A ( BIOMD0000000513 ) is the model
  developed originally by Achar.
io:
  inputs:
  - name: initial_glycolysis_state_1
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.initial_glycolysis_state_1
    default: 0.1
    units: native SBML value
    description: Initial condition for glycolysis state 1. Maps to bundled SBML symbol `_2PGA_c`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_2
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.initial_glycolysis_state_2
    default: 2.23132912
    units: native SBML value
    description: Initial condition for glycolysis state 2. Maps to bundled SBML symbol `DHAP_c`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_3
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.initial_glycolysis_state_3
    default: 0.2405
    units: native SBML value
    description: Initial condition for glycolysis state 3. Maps to bundled SBML symbol `ATP_g`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_4
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.initial_glycolysis_state_4
    default: 8.483130623
    units: native SBML value
    description: Initial condition for glycolysis state 4. Maps to bundled SBML symbol `DHAP_g`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glycolysis_state_5
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.initial_glycolysis_state_5
    default: 1.519
    units: native SBML value
    description: Initial condition for glycolysis state 5. Maps to bundled SBML symbol `ADP_g`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: glycolysis_state_1
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.glycolysis_state_1
  - name: glycolysis_state_2
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.glycolysis_state_2
  - name: glycolysis_state_3
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.glycolysis_state_3
  - name: glycolysis_state_4
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.glycolysis_state_4
  - name: glycolysis_state_5
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.glycolysis_state_5
  - name: observable_values
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model.observable_labels
models:
- alias: metabolism_sbml_kerkhoven2013_glycolysis_in_t_brucei_model_a_biomd0000000513_model
