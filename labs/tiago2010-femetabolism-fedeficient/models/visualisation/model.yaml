        label: Iron In Plasma
        maps_to: s1
      - id: iron_in_bone_marrow
        label: Iron In Bone Marrow
        maps_to: s2
      - id: iron_metabolism_state_3
        label: Iron Metabolism state 3
        maps_to: s3
      - id: iron_in_spleen
        label: Iron In Spleen
        maps_to: s4
      - id: iron_in_liver
        label: Iron In Liver
        maps_to: s5
      - id: iron_in_muscle
        label: Iron In Muscle
        maps_to: s6
      - id: iron_in_duodenum
        label: Iron In Duodenum
        maps_to: s7
      - id: iron_in_integument
        label: Iron In Integument
        maps_to: s8
      - id: iron_in_intestine
        label: Iron In Intestine
        maps_to: s9
      - id: iron_ions_outside
        label: Iron Ions Outside
        maps_to: s10
      - id: iron_in_heart
        label: Iron In Heart
        maps_to: s11
