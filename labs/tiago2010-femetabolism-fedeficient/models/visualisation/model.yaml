    lab_title: Tiago2010_FeMetabolism_FeDeficient Lab
    question: Which iron and heme metabolism observables show the strongest activity in Tiago2010_FeMetabolism_FeDeficient?
    answer_focus: iron and heme metabolism
    sources:
    - alias: metabolism_sbml_tiago2010_femetabolism_fedeficient_biomd0000000259_model
