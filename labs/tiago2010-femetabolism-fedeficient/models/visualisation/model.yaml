schema_version: '2.0'
title: Tiago2010_FeMetabolism_FeDeficient Visualisation
description: Dedicated presentation model for Tiago2010_FeMetabolism_FeDeficient.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
