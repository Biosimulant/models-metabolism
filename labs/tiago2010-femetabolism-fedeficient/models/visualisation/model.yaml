parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_tiago2010_femetabolism_fedeficient_biomd0000000259_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_tiago2010_femetabolism_fedeficient_biomd0000000259_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_tiago2010_femetabolism_fedeficient_biomd0000000259_model_observable_labels
