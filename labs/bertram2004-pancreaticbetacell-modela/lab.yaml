  - name: fructose_bisphosphate
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.fructose_bisphosphate
  - name: observable_values
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.run_summary
  - name: observable_labels
