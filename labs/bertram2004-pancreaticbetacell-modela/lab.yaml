  - name: pancreatic_metabolism_state_1
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.pancreatic_metabolism_state_1
  - name: pancreatic_metabolism_state_2
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.pancreatic_metabolism_state_2
  - name: pancreatic_metabolism_state_3
    maps_to: metabolism_sbml_bertram2004_pancreaticbetacell_modela_model1006230071_model.pancreatic_metabolism_state_3
  - name: pancreatic_metabolism_state_4
