  - name: glycolysis_state_1
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_and_pentose_phosphate_p_biomd0000000515_model.glycolysis_state_1
  - name: glycolysis_state_2
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_and_pentose_phosphate_p_biomd0000000515_model.glycolysis_state_2
  - name: glycolysis_state_3
