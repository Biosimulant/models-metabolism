  - name: glycolysis_state_4
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_and_pentose_phosphate_p_biomd0000000515_model.glycolysis_state_4
  - name: glycolysis_state_5
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_and_pentose_phosphate_p_biomd0000000515_model.glycolysis_state_5
  - name: observable_values
    maps_to: metabolism_sbml_kerkhoven2013_glycolysis_and_pentose_phosphate_p_biomd0000000515_model.observable_values
  - name: run_summary
