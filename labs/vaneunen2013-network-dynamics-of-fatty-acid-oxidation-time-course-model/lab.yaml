schema_version: '2.0'
title: "vanEunen2013 - Network dynamics of fatty acid \u03B2-oxidation (time-course model)\
  \ Lab"
description: "vanEunen2013 - Network dynamics of fatty acid \u03B2-oxidation (time-course\
  \ model) Lipid metabolism plays an important role in the development of metabolic syndrome,\
  \ a major risk factor for cardiovascular. It can be used to explore metabolic flux dynamics\
  \ and compare pathway behavior across conditions."
