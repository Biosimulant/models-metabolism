      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_5
    maps_to: metabolism_sbml_green1985_whole_body_vitamin_a_metabolism_in_rat_model2311220001_model.initial_vitamin_a_metabolism_state_5
    default: 0.0
