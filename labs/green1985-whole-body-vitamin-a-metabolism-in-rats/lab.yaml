  - name: initial_vitamin_a_metabolism_state_3
    maps_to: metabolism_sbml_green1985_whole_body_vitamin_a_metabolism_in_rat_model2311220001_model.initial_vitamin_a_metabolism_state_3
    default: 0.0
    units: native SBML value
    description: Initial condition for vitamin a metabolism state 3. Maps to bundled SBML
      symbol `M_2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_4
