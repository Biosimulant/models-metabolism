schema_version: '2.0'
title: Masison2022 - Liver Iron Metabolism with updated ferritin
description: This is a new version of a liver iron model (original from Mitchell 2013 BIOMD0000000498)
  with updated kinetics of ferritin iron storage. It uses MODEL2211030001 as a substitute
  for the original ferri.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Joseph Masison
- Mendes P
upstream:
  id: biomodels_ebi:MODEL2211030002
  source_db: biomodels_ebi
  source_id: MODEL2211030002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2211030002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2211030002?filename=LiverIronMetabolism_UpdatedFerritin_sbml_l3v1.xml
  license: CC0
biosim:
  entrypoint: src.masison2022_liver_iron_metabolism_with_updated_f_model2211030002_model:Masison2022LiverIronMetabolismWithUpdatedFModel2211030002Model
  init_kwargs:
    model_path: data/MODEL2211030002.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_iron_metabolism_state_1
    maps_to: species_7
    default: 1.13750420250257e-08
    units: native SBML value
    description: Initial condition for iron metabolism state 1. Maps to bundled SBML symbol
      `species_7`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_iron_metabolism_state_2
    maps_to: species_1
    default: 5.53114277751551e-11
    units: native SBML value
    description: Initial condition for iron metabolism state 2. Maps to bundled SBML symbol
      `species_1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_iron_metabolism_state_3
    maps_to: species_5
    default: 4.81985997445553e-09
    units: native SBML value
    description: Initial condition for iron metabolism state 3. Maps to bundled SBML symbol
      `species_5`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_iron_metabolism_state_4
    maps_to: species_2
    default: 4.91004767574587e-06
    units: native SBML value
    description: Initial condition for iron metabolism state 4. Maps to bundled SBML symbol
      `species_2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_iron_metabolism_state_5
    maps_to: species_4
    default: 4.04747006186017e-06
    units: native SBML value
    description: Initial condition for iron metabolism state 5. Maps to bundled SBML symbol
      `species_4`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: iron_metabolism_state_1
    maps_to: species_7
    label: Iron Metabolism state 1
    description: Iron Metabolism state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_7`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: iron_metabolism_state_2
    maps_to: species_1
    label: Iron Metabolism state 2
    description: Iron Metabolism state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_1`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: iron_metabolism_state_3
    maps_to: species_5
    label: Iron Metabolism state 3
    description: Iron Metabolism state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_5`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: iron_metabolism_state_4
    maps_to: species_2
    label: Iron Metabolism state 4
    description: Iron Metabolism state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: iron_metabolism_state_5
    maps_to: species_4
    label: Iron Metabolism state 5
    description: Iron Metabolism state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_4`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
