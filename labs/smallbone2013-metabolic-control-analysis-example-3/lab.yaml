schema_version: '2.0'
package: smallbone2013-metabolic-control-analysis-example-3
version: 1.0.0
title: Smallbone2013 - Metabolic Control Analysis - Example 3 Lab
description: Smallbone2013 - Metabolic Control Analysis - Example 3 Metabolic control analysis
  (MCA) is a biochemical formalism, defining how variables, such as fluxes and concentrations,
  depend on network paramet. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.initial_metabolic_pathway_state_1
    default: 0.05625738310526
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `x1`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.initial_metabolic_pathway_state_2
    default: 0.76876151899652
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `x2`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.initial_metabolic_pathway_state_3
    default: 4.23123848100348
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `x3`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.initial_metabolic_pathway_state_4
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `x4`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.metabolic_pathway_state_2
  - name: metabolic_pathway_state_3
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.metabolic_pathway_state_3
  - name: metabolic_pathway_state_4
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.metabolic_pathway_state_4
  - name: observable_values
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_smallbone2013_metabolic_control_analysis_example_biomd0000000456_model.run_summary
  - name: observable_labels
