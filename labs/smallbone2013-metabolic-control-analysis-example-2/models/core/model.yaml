schema_version: '2.0'
title: Smallbone2013 - Metabolic Control Analysis - Example 2
description: Smallbone2013 - Metabolic Control Analysis - Example 2 Metabolic control analysis
  (MCA) is a biochemical formalism, defining how variables, such as fluxes and concentrations,
  depend on network paramet. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Kieran Smallbone
upstream:
  id: biomodels_ebi:BIOMD0000000455
  source_db: biomodels_ebi
  source_id: BIOMD0000000455
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000455
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000455?filename=BIOMD0000000455_url.xml
  license: CC0
biosim:
  entrypoint: src.smallbone2013_metabolic_control_analysis_example_biomd0000000455_model:Smallbone2013MetabolicControlAnalysisExampleBiomd0000000455Model
  init_kwargs:
    model_path: data/BIOMD0000000455.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: x1
    default: 0.05625738310526
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `x1`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: x2
    default: 0.76876151899652
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `x2`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: x3
    default: 4.23123848100348
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `x3`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: x1
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `x1`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: x2
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `x2`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: x3
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `x3`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
