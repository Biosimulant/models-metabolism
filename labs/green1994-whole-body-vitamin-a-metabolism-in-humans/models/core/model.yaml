schema_version: '2.0'
title: Green1994 - whole-body vitamin A metabolism in humans
description: Metabolism Green1994Whole Body Vitamin AMetabolism In Hum Model2403010001Model
  represents core biological mechanisms from biomodels_ebi reference biomodels_ebi:MODEL2403010001.
  When you run it, you can inspect state and compare temporal behavior between baseline and
  adjusted inputs.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Michael H. Green
- Joanne Balmer Green
upstream:
