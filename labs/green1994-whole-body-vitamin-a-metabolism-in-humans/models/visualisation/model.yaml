schema_version: '2.0'
title: Green1994 - whole-body vitamin A metabolism in humans Visualisation
description: Dedicated presentation model for Green1994 - whole-body vitamin A metabolism
  in humans.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Green1994 - whole-body vitamin A metabolism in humans Lab
    question: Which vitamin A metabolism observables show the strongest activity in Green1994
      - whole-body vitamin A metabolism in humans?
    answer_focus: vitamin A metabolism
    sources:
    - alias: metabolism_sbml_green1994_whole_body_vitamin_a_metabolism_in_hum_model2403010001_model
      title: Green1994 - whole-body vitamin A metabolism in humans
      scope: vitamin A metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: vitamin_a_metabolism_state_1
        label: Vitamin A Metabolism state 1
        maps_to: M_1
      - id: vitamin_a_metabolism_state_2
        label: Vitamin A Metabolism state 2
        maps_to: M_2
      - id: vitamin_a_metabolism_state_3
        label: Vitamin A Metabolism state 3
        maps_to: M_3
      - id: vitamin_a_metabolism_state_4
        label: Vitamin A Metabolism state 4
        maps_to: M_1_0
      - id: vitamin_a_metabolism_state_5
        label: Vitamin A Metabolism state 5
        maps_to: M_2_0
      - id: vitamin_a_metabolism_state_6
        label: Vitamin A Metabolism state 6
        maps_to: M_3_0
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_green1994_whole_body_vitamin_a_metabolism_in_hum_model2403010001_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_green1994_whole_body_vitamin_a_metabolism_in_hum_model2403010001_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_green1994_whole_body_vitamin_a_metabolism_in_hum_model2403010001_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
