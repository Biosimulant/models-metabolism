schema_version: '2.0'
package: garde2020-metabolic-oscillations-in-bacillus-subtilis-biofilms
version: 1.0.0
title: Garde2020 - metabolic oscillations in Bacillus subtilis biofilms Lab
description: Ravindra Garde, Bashar Ibrahim & Stefan Schuster. Extending the minimal model
  of metabolic oscillations in Bacillus subtilis biofilms.
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.initial_metabolic_pathway_state_1
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `Gp`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.initial_metabolic_pathway_state_2
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `Ai`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.initial_metabolic_pathway_state_3
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `Am`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.initial_metabolic_pathway_state_4
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `Ap`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.initial_metabolic_pathway_state_5
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `Gm`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.metabolic_pathway_state_2
  - name: metabolic_pathway_state_3
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.metabolic_pathway_state_3
  - name: metabolic_pathway_state_4
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.metabolic_pathway_state_4
  - name: metabolic_pathway_state_5
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.metabolic_pathway_state_5
  - name: observable_values
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model.observable_labels
