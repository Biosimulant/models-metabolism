schema_version: '2.0'
title: Garde2020 - metabolic oscillations in Bacillus subtilis biofilms
description: Ravindra Garde, Bashar Ibrahim & Stefan Schuster. Extending the minimal model
  of metabolic oscillations in Bacillus subtilis biofilms.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Garde R
- Ibrahim B
- Schuster S
upstream:
  id: biomodels_ebi:BIOMD0000001053
  source_db: biomodels_ebi
  source_id: BIOMD0000001053
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000001053
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000001053?filename=Garde2020.xml
  license: CC0
biosim:
  entrypoint: src.garde2020_metabolic_oscillations_in_bacillus_sub_biomd0000001053_model:Garde2020MetabolicOscillationsInBacillusSubBiomd0000001053Model
  init_kwargs:
    model_path: data/BIOMD0000001053.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: Gp
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `Gp`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: Ai
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `Ai`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: Am
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `Am`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: Ap
    default: 0.999999999999999
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `Ap`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: Gm
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `Gm`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: Gp
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Gp`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: Ai
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Ai`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: Am
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Am`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_4
    maps_to: Ap
    label: Metabolic Pathway state 4
    description: Metabolic Pathway state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Ap`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: Gm
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Gm`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
