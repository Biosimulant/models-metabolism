schema_version: '2.0'
title: Piedrafita2010_MR_System Visualisation
description: Dedicated presentation model for Piedrafita2010_MR_System.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Piedrafita2010_MR_System Lab
    question: Which metabolic pathway dynamics observables show the strongest activity in
      Piedrafita2010_MR_System?
    answer_focus: metabolic pathway dynamics
    sources:
    - alias: metabolism_sbml_piedrafita2010_mr_system_biomd0000000257_model
      title: Piedrafita2010_MR_System
      scope: metabolic pathway dynamics
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: metabolic_pathway_state_1
        label: Metabolic Pathway state 1
        maps_to: STU
      - id: metabolic_pathway_state_2
        label: Metabolic Pathway state 2
        maps_to: STUS
      - id: metabolic_pathway_state_3
        label: Metabolic Pathway state 3
        maps_to: STUST
      - id: metabolic_pathway_state_4
        label: Metabolic Pathway state 4
        maps_to: STUSU
      - id: metabolic_pathway_state_5
        label: Metabolic Pathway state 5
        maps_to: SU
      - id: metabolic_pathway_state_6
        label: Metabolic Pathway state 6
        maps_to: ST
      - id: metabolic_pathway_state_7
        label: Metabolic Pathway state 7
        maps_to: SUST
      - id: metabolic_pathway_state_8
        label: Metabolic Pathway state 8
        maps_to: SUSTU
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_piedrafita2010_mr_system_biomd0000000257_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_piedrafita2010_mr_system_biomd0000000257_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_piedrafita2010_mr_system_biomd0000000257_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
