schema_version: '2.0'
title: Reddyhoff2015 - Acetaminophen metabolism and toxicity Lab
description: Reddyhoff2015 - Acetaminophen metabolism and toxicity This model examines acetaminophen
  metabolism and related hepatotoxicity. Multiple pathways associated with APAP metabolism
  has been included in th.
io:
