    description: Initial condition for glutathione. Maps to bundled SBML symbol `GSH`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_3
    maps_to: metabolism_sbml_reddyhoff2015_acetaminophen_metabolism_and_toxic_biomd0000000609_model.initial_drug_metabolism_state_3
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolism state 3. Maps to bundled SBML symbol
      `NAPQI`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_4
    maps_to: metabolism_sbml_reddyhoff2015_acetaminophen_metabolism_and_toxic_biomd0000000609_model.initial_drug_metabolism_state_4
    default: 1.32e-13
    units: native SBML value
    description: Initial condition for drug metabolism state 4. Maps to bundled SBML symbol
      `Paracetamol_APAP`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_5
    maps_to: metabolism_sbml_reddyhoff2015_acetaminophen_metabolism_and_toxic_biomd0000000609_model.initial_drug_metabolism_state_5
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolism state 5. Maps to bundled SBML symbol
      `Protein_adducts`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
