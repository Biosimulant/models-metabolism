  - name: initial_sulphate_paps
    maps_to: metabolism_sbml_reddyhoff2015_acetaminophen_metabolism_and_toxic_biomd0000000609_model.initial_sulphate_paps
    default: 1.325e-14
    units: native SBML value
    description: Initial condition for sulphate paps. Maps to bundled SBML symbol `Sulphate__PAPS`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_glutathione
    maps_to: metabolism_sbml_reddyhoff2015_acetaminophen_metabolism_and_toxic_biomd0000000609_model.initial_glutathione
    default: 6.87e-15
