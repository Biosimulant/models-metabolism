schema_version: '2.0'
title: Gupta2009 - Eicosanoid Metabolism
description: 'Gupta2009 - Eicosanoid Metabolism Integrated model of eicosanoid metabolism
  and signaling based on lipidomics flux analysis. This model is described in the article:
  An integrated model of eicosanoid m.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Shakti Gupta
- Mano Ram Maurya
- Daren L Stephens
- Edward A Dennis
- Shankar Subramaniam
upstream:
  id: biomodels_ebi:BIOMD0000000436
  source_db: biomodels_ebi
  source_id: BIOMD0000000436
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000436
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000436?filename=BIOMD0000000436_url.xml
  license: CC0
biosim:
  entrypoint: src.gupta2009_eicosanoid_metabolism_biomd0000000436_model:Gupta2009EicosanoidMetabolismBiomd0000000436Model
  init_kwargs:
    model_path: data/BIOMD0000000436.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_lipid_metabolism_state_1
    maps_to: HETE
    default: 0.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 1. Maps to bundled SBML symbol
      `HETE`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_2
    maps_to: PGH2
    default: 0.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 2. Maps to bundled SBML symbol
      `PGH2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_3
    maps_to: PGE2
    default: 0.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 3. Maps to bundled SBML symbol
      `PGE2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_4
    maps_to: PGF2a
    default: 0.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 4. Maps to bundled SBML symbol
      `PGF2a`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_5
    maps_to: PGD2
    default: 0.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 5. Maps to bundled SBML symbol
      `PGD2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: lipid_metabolism_state_1
    maps_to: HETE
    label: Lipid Metabolism state 1
    description: Lipid Metabolism state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `HETE`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: lipid_metabolism_state_2
    maps_to: PGH2
    label: Lipid Metabolism state 2
    description: Lipid Metabolism state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `PGH2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: lipid_metabolism_state_3
    maps_to: PGE2
    label: Lipid Metabolism state 3
    description: Lipid Metabolism state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `PGE2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: lipid_metabolism_state_4
    maps_to: PGF2a
    label: Lipid Metabolism state 4
    description: Lipid Metabolism state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `PGF2a`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: lipid_metabolism_state_5
    maps_to: PGD2
    label: Lipid Metabolism state 5
    description: Lipid Metabolism state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `PGD2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
