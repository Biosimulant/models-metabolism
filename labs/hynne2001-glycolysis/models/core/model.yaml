schema_version: '2.0'
title: Hynne2001_Glycolysis
description: The model reproduces Fig 6 of the paper. It can be used to explore metabolic
  flux dynamics and compare pathway behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- F Hynne
- "S Dan\xF8"
- "P G S\xF8rensen"
upstream:
  id: biomodels_ebi:BIOMD0000000061
  source_db: biomodels_ebi
  source_id: BIOMD0000000061
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000061
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000061?filename=BIOMD0000000061_url.xml
  license: CC0
biosim:
  entrypoint: src.hynne2001_glycolysis_biomd0000000061_model:Hynne2001GlycolysisBiomd0000000061Model
  init_kwargs:
    model_path: data/BIOMD0000000061.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_extracellular_glucose
    maps_to: GlcX
    default: 6.7
    units: native SBML value
    description: Initial condition for extracellular glucose. Maps to bundled SBML symbol
      `GlcX`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_cytosolic_glucose
    maps_to: Glc
    default: 0.573074
    units: native SBML value
    description: Initial condition for cytosolic glucose. Maps to bundled SBML symbol `Glc`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: ATP
    default: 2.1
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 4.2
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_adp
    maps_to: ADP
    default: 1.5
    units: native SBML value
    description: Initial condition for adp. Maps to bundled SBML symbol `ADP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  outputs:
  - name: extracellular_glucose
    maps_to: GlcX
    label: Extracellular Glucose
    description: Extracellular Glucose. Maps to SBML symbol `GlcX`.
  - name: cytosolic_glucose
    maps_to: Glc
    label: Cytosolic Glucose
    description: Cytosolic Glucose. Maps to SBML symbol `Glc`.
  - name: atp
    maps_to: ATP
    label: ATP
    description: ATP. Maps to SBML symbol `ATP`.
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: adp
    maps_to: ADP
    label: ADP
    description: ADP. Maps to SBML symbol `ADP`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
