schema_version: '2.0'
title: Hynne2001_Glycolysis Visualisation
description: Dedicated presentation model for Hynne2001_Glycolysis.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Hynne2001_Glycolysis Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Hynne2001_Glycolysis?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_hynne2001_glycolysis_biomd0000000061_model
      title: Hynne2001_Glycolysis
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: extracellular_glucose
        label: Extracellular Glucose
        maps_to: GlcX
      - id: cytosolic_glucose
        label: Cytosolic Glucose
        maps_to: Glc
      - id: atp
        label: ATP
        maps_to: ATP
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: G6P
      - id: adp
        label: ADP
        maps_to: ADP
      - id: fructose_6_phosphate
        label: Fructose 6 Phosphate
        maps_to: F6P
      - id: fructose_1_6_bisphosphate
        label: Fructose 1 6 Bisphosphate
        maps_to: FBP
      - id: glyceraldehyde_3_phosphate
        label: Glyceraldehyde 3 Phosphate
        maps_to: GAP
      - id: dihydroxyacetone_phosphate
        label: Dihydroxyacetone Phosphate
        maps_to: DHAP
      - id: nad
        label: NAD
        maps_to: NAD
      - id: observable_1_3_bisphosphoglycerate
        label: 1 3 Bisphosphoglycerate
        maps_to: BPG
      - id: nadh
        label: NADH
        maps_to: NADH
      - id: phosphoenolpyruvate
        label: Phosphoenolpyruvate
        maps_to: PEP
      - id: pyruvate
        label: Pyruvate
        maps_to: Pyr
      - id: acetaldehyde
        label: Acetaldehyde
        maps_to: ACA
      - id: glycolysis_state_16
        label: Glycolysis state 16
        maps_to: EtOH
      - id: extracellular_ethanol
        label: Extracellular Ethanol
        maps_to: EtOHX
      - id: glycolysis_state_18
        label: Glycolysis state 18
        maps_to: Glyc
      - id: extracellular_glycerol
        label: Extracellular Glycerol
        maps_to: GlycX
      - id: extracellular_acetaldehyde
        label: Extracellular Acetaldehyde
        maps_to: ACAX
      - id: extracellular_cyanide
        label: Extracellular Cyanide
        maps_to: CNX
      - id: amp
        label: AMP
        maps_to: AMP
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_hynne2001_glycolysis_biomd0000000061_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_hynne2001_glycolysis_biomd0000000061_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_hynne2001_glycolysis_biomd0000000061_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
