schema_version: '2.0'
title: Bae2017 - Mathematical analysis of circadian disruption and metabolic re-entrainment
  of hepatic gluconeogenesis
description: The circadian rhythms influence the metabolic activity from molecular level to
  tissue, organ, and host level. Disruption of the circadian rhythms manifests to the host's
  health as metabolic syndromes,.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Seul-A Bae
- Ioannis P Androulakis
upstream:
  id: biomodels_ebi:BIOMD0000001005
  source_db: biomodels_ebi
  source_id: BIOMD0000001005
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000001005
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000001005?filename=Bae2018.xml
  license: CC0
biosim:
  entrypoint: src.bae2017_mathematical_analysis_of_circadian_disru_biomd0000001005_model:Bae2017MathematicalAnalysisOfCircadianDisruBiomd0000001005Model
  init_kwargs:
    model_path: data/BIOMD0000001005.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_crh
    maps_to: CRH
    default: 1.0
    units: native SBML value
    description: Initial condition for crh. Maps to bundled SBML symbol `CRH`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_acth
    maps_to: ACTH
    default: 1.0
    units: native SBML value
    description: Initial condition for acth. Maps to bundled SBML symbol `ACTH`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: F_HPA
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `F_HPA`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4_cytosolic
    maps_to: F_Cell
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 4 cytosolic. Maps to bundled
      SBML symbol `F_Cell`. Applied before the Tellurium simulation starts; this does not
      change kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: y1
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `y1`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: crh
    maps_to: CRH
    label: CRH
    description: CRH. Maps to SBML symbol `CRH`.
  - name: acth
    maps_to: ACTH
    label: ACTH
    description: ACTH. Maps to SBML symbol `ACTH`.
  - name: metabolic_pathway_state_3
    maps_to: F_HPA
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `F_HPA`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_4_cytosolic
    maps_to: F_Cell
    label: Metabolic Pathway state 4 cytosolic
    description: Metabolic Pathway state 4 cytosolic; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `F_Cell`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: y1
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `y1`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
