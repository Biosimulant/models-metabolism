schema_version: '2.0'
title: Nazaret2008_Dynnik1980_CarbohydrateEnergyMetabolism
description: "This model is from the article: An old paper revisited: \u2018\u2018A mathematical\
  \ model of carbohydrate energy metabolism. Interaction between glycolysis, the Krebs cycle\
  \ and the H-transporting shuttles at var."
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Christine Nazaret
- Jean-Pierre Mazat
upstream:
  id: biomodels_ebi:MODEL1202170000
  source_db: biomodels_ebi
  source_id: MODEL1202170000
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1202170000
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1202170000?filename=MODEL1202170000_url.xml
  license: CC0
biosim:
  entrypoint: src.nazaret2008_dynnik1980_carbohydrateenergymetabol_model1202170000_model:Nazaret2008Dynnik1980CarbohydrateenergymetabolModel1202170000Model
  init_kwargs:
    model_path: data/MODEL1202170000.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glyceraldehyde_3_phosphate
    maps_to: s1
    default: 0.1
    units: native SBML value
    description: Initial condition for glyceraldehyde 3 phosphate. Maps to bundled SBML symbol
      `s1`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: s2_e1
    default: 0.5
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `s2_e1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_observable_13dpg
    maps_to: s3_e2
    default: 0.5
    units: native SBML value
    description: Initial condition for observable 13dpg. Maps to bundled SBML symbol `s3_e2`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_pyruvate
    maps_to: s4_e3
    default: 0.01
    units: native SBML value
    description: Initial condition for pyruvate. Maps to bundled SBML symbol `s4_e3`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_lactate
    maps_to: s5_e4
    default: 0.01
    units: native SBML value
    description: Initial condition for lactate. Maps to bundled SBML symbol `s5_e4`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  outputs:
  - name: glyceraldehyde_3_phosphate
    maps_to: s1
    label: glyceraldehyde 3 phosphate
    description: glyceraldehyde 3 phosphate. Maps to SBML symbol `s1`.
  - name: metabolic_pathway_state_2
    maps_to: s2_e1
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `s2_e1`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_13dpg
    maps_to: s3_e2
    label: 13dpg
    description: 13dpg. Maps to SBML symbol `s3_e2`.
  - name: pyruvate
    maps_to: s4_e3
    label: pyruvate
    description: pyruvate. Maps to SBML symbol `s4_e3`.
  - name: lactate
    maps_to: s5_e4
    label: lactate
    description: lactate. Maps to SBML symbol `s5_e4`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
