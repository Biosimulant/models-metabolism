schema_version: '2.0'
title: Garde2020-Minimal model describing metabolic oscillations in Bacillus subtilis biofilms
  Visualisation
description: Dedicated presentation model for Garde2020-Minimal model describing metabolic
  oscillations in Bacillus subtilis biofilms.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Garde2020-Minimal model describing metabolic oscillations in Bacillus subtilis
      biofilms Lab
    question: Which metabolic pathway dynamics observables show the strongest activity in
      Garde2020-Minimal model describing metabolic oscillations in Bacillus subtilis biofilms?
    answer_focus: metabolic pathway dynamics
    sources:
    - alias: metabolism_sbml_garde2020_minimal_model_describing_metabolic_osc_biomd0000000932_model
      title: Garde2020-Minimal model describing metabolic oscillations in Bacillus subtilis
        biofilms
      scope: metabolic pathway dynamics
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: metabolic_pathway_state_1
        label: Metabolic Pathway state 1
        maps_to: Gp
      - id: metabolic_pathway_state_2
        label: Metabolic Pathway state 2
        maps_to: Gi
      - id: metabolic_pathway_state_3
        label: Metabolic Pathway state 3
        maps_to: A
      - id: metabolic_pathway_state_4
        label: Metabolic Pathway state 4
        maps_to: B
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_garde2020_minimal_model_describing_metabolic_osc_biomd0000000932_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_garde2020_minimal_model_describing_metabolic_osc_biomd0000000932_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_garde2020_minimal_model_describing_metabolic_osc_biomd0000000932_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
