schema_version: '2.0'
title: "ODea2007 - A homeostatic model of I\u03BAB metabolism to control constitutive NF-\u03BA\
  B activity"
description: Insert Citation Questions concerning the paper should be addressed to the corresponding
  author. Alexander Hoffmann (ahoffmann@ucsd.edu) The original model was written and simulated
  within MathWorks Ma.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Ellen L O'Dea
- Derren Barken
- Raechel Q Peralta
- Kim T Tran
- Shannon L Werner
upstream:
  id: biomodels_ebi:MODEL1908270002
  source_db: biomodels_ebi
  source_id: MODEL1908270002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1908270002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1908270002?filename=Odea2007.xml
  license: CC0
biosim:
  entrypoint: src.odea2007_a_homeostatic_model_of_i_b_metabolism_t_model1908270002_model:Odea2007AHomeostaticModelOfIBMetabolismTModel1908270002Model
  init_kwargs:
    model_path: data/MODEL1908270002.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: IkBa_mRNA
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `IkBa_mRNA`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: IkBa_cytoplasm
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `IkBa_cytoplasm`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: IkBa_nucleus
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `IkBa_nucleus`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: IkBaIKK
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `IkBaIKK`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: IkBaNFkB_cytoplasm
    default: 0.06
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `IkBaNFkB_cytoplasm`. Applied before the Tellurium simulation starts; this does not
      change kinetic parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: IkBa_mRNA
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `IkBa_mRNA`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: IkBa_cytoplasm
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `IkBa_cytoplasm`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: IkBa_nucleus
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `IkBa_nucleus`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: metabolic_pathway_state_4
    maps_to: IkBaIKK
    label: Metabolic Pathway state 4
    description: Metabolic Pathway state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `IkBaIKK`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: IkBaNFkB_cytoplasm
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `IkBaNFkB_cytoplasm`. Exact metabolite identity
      is not encoded in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
