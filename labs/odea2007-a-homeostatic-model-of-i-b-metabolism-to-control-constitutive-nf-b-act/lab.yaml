  - name: metabolic_pathway_state_5
    maps_to: metabolism_sbml_odea2007_a_homeostatic_model_of_i_b_metabolism_t_model1908270002_model.metabolic_pathway_state_5
  - name: observable_values
    maps_to: metabolism_sbml_odea2007_a_homeostatic_model_of_i_b_metabolism_t_model1908270002_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_odea2007_a_homeostatic_model_of_i_b_metabolism_t_model1908270002_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_odea2007_a_homeostatic_model_of_i_b_metabolism_t_model1908270002_model.observable_labels
models:
