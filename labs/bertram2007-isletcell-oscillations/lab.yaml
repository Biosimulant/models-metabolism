schema_version: '2.0'
title: Bertram2007_IsletCell_Oscillations Lab
description: 'This is the model described in the article: Interaction of glycolysis and mitochondrial
  respiration in metabolic oscillations of pancreatic islets. Bertram R, Satin LS, Pedersen
  MG, Luciani DS, Sherma.'
io:
  inputs:
  - name: initial_pancreatic_metabolism_state_1
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.initial_pancreatic_metabolism_state_1
    default: -60.0
    units: native SBML value
    description: Initial condition for pancreatic metabolism state 1. Maps to bundled SBML
      symbol `Vm`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_pancreatic_metabolism_state_2
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.initial_pancreatic_metabolism_state_2
    default: 0.0
    units: native SBML value
    description: Initial condition for pancreatic metabolism state 2. Maps to bundled SBML
      symbol `n`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.initial_glucose_6_phosphate
    default: 301.0
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_bisphosphate
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.initial_fructose_bisphosphate
    default: 2.16
    units: native SBML value
    description: Initial condition for fructose bisphosphate. Maps to bundled SBML symbol
      `FBP`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_mitochondrial_nadh
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.initial_mitochondrial_nadh
    default: 0.4
    units: native SBML value
    description: Initial condition for mitochondrial nadh. Maps to bundled SBML symbol `NADHm`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: pancreatic_metabolism_state_1
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.pancreatic_metabolism_state_1
  - name: pancreatic_metabolism_state_2
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.pancreatic_metabolism_state_2
  - name: glucose_6_phosphate
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.glucose_6_phosphate
  - name: fructose_bisphosphate
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.fructose_bisphosphate
  - name: mitochondrial_nadh
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.mitochondrial_nadh
  - name: observable_values
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.observable_labels
models:
- alias: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000376.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.observable_values
  to:
  - visualisation.metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model_observable_values
- from: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.run_summary
  to:
  - visualisation.metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model_run_summary
- from: metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model.observable_labels
  to:
  - visualisation.metabolism_sbml_bertram2007_isletcell_oscillations_biomd0000000376_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
