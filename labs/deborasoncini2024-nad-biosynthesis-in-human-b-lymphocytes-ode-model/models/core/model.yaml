schema_version: '2.0'
title: DeboraSoncini2024 - NAD_Biosynthesis_in Human_B_Lymphocytes,ODE model
description: This SBML file was created to capture NAD biosynthesis in human B-cells. This
  model contains 27 reactions with 42 enzymes, 31 metabolites and 157 parameters.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Adithya Chedere
- Debora Soncini
- Nagasuma Chandra
- MICHELE CEA
upstream:
  id: biomodels_ebi:MODEL2311140001
  source_db: biomodels_ebi
  source_id: MODEL2311140001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2311140001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2311140001?filename=NADnet_Bcell_model_L2V4_Nov2024.xml
  license: CC0
biosim:
  entrypoint: src.deborasoncini2024_nad_biosynthesis_in_human_b_ly_model2311140001_model:Deborasoncini2024NadBiosynthesisInHumanBLyModel2311140001Model
  init_kwargs:
    model_path: data/MODEL2311140001.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_nad_metabolism_state_1
    maps_to: Hydroxykynurenine
    default: 0.0
    units: native SBML value
    description: Initial condition for nad metabolism state 1. Maps to bundled SBML symbol
      `Hydroxykynurenine`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_nad_metabolism_state_2
    maps_to: Hydroxyanthranilate
    default: 0.0
    units: native SBML value
    description: Initial condition for nad metabolism state 2. Maps to bundled SBML symbol
      `Hydroxyanthranilate`. Applied before the Tellurium simulation starts; this does not
      change kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_nad_metabolism_state_3
    maps_to: Quinolinate
    default: 0.0
    units: native SBML value
    description: Initial condition for nad metabolism state 3. Maps to bundled SBML symbol
      `Quinolinate`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_nad_metabolism_state_4
    maps_to: NaMN
    default: 0.0
    units: native SBML value
    description: Initial condition for nad metabolism state 4. Maps to bundled SBML symbol
      `NaMN`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_nad_metabolism_state_5
    maps_to: PPi
    default: 0.0
    units: native SBML value
    description: Initial condition for nad metabolism state 5. Maps to bundled SBML symbol
      `PPi`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: nad_metabolism_state_1
    maps_to: Hydroxykynurenine
    label: NAD Metabolism state 1
    description: NAD Metabolism state 1; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `Hydroxykynurenine`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: nad_metabolism_state_2
    maps_to: Hydroxyanthranilate
    label: NAD Metabolism state 2
    description: NAD Metabolism state 2; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `Hydroxyanthranilate`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: nad_metabolism_state_3
    maps_to: Quinolinate
    label: NAD Metabolism state 3
    description: NAD Metabolism state 3; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `Quinolinate`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: nad_metabolism_state_4
    maps_to: NaMN
    label: NAD Metabolism state 4
    description: NAD Metabolism state 4; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `NaMN`. Exact metabolite identity is not encoded in the
      bundled SBML metadata.
  - name: nad_metabolism_state_5
    maps_to: PPi
    label: NAD Metabolism state 5
    description: NAD Metabolism state 5; conservative display label for an abstract SBML state
      variable. Maps to SBML symbol `PPi`. Exact metabolite identity is not encoded in the
      bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
