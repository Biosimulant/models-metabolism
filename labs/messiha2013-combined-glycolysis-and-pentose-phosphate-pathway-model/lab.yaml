version: 1.0.0
title: Messiha2013 - combined glycolysis and pentose phosphate pathway model Lab
description: Messiha2013 - combined glycolysis and pentose phosphate pathway model BIOMD0000000502
  and MODEL1303260018 are combined to examine the response to oxidative stress. It can be
  used to explore metabolic flux dynamics and compare pathway behavior across conditions.
