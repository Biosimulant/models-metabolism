schema_version: '2.0'
title: Lai2007_O2_Transport_Metabolism
description: 'This file describes the SBML version of the mathematical model in the following
  journal article: Linking Pulmonary Oxygen Uptake, Muscle Oxygen Utilization and Cellular
  Metabolism during Exercise, Ann. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Nicola Lai
- Marco Camesasca
- Gerald M Saidel
- Ranjan K Dash
- Marco E Cabrera
upstream:
  id: biomodels_ebi:BIOMD0000000248
  source_db: biomodels_ebi
  source_id: BIOMD0000000248
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000248
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000248?filename=BIOMD0000000248_url.xml
  license: CC0
biosim:
  entrypoint: src.lai2007_o2_transport_metabolism_biomd0000000248_model:Lai2007O2TransportMetabolismBiomd0000000248Model
  init_kwargs:
    model_path: data/BIOMD0000000248.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_atp
    maps_to: ATP
    default: 8.198857
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: PCr
    default: 40.98942
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `PCr`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_adp
    maps_to: ADP
    default: 0.001142
    units: native SBML value
    description: Initial condition for adp. Maps to bundled SBML symbol `ADP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: Cr
    default: 1.01056
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `Cr`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: Pi
    default: 0.5
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `Pi`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: atp
    maps_to: ATP
    label: ATP
    description: ATP. Maps to SBML symbol `ATP`.
  - name: metabolic_pathway_state_2
    maps_to: PCr
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `PCr`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: adp
    maps_to: ADP
    label: ADP
    description: ADP. Maps to SBML symbol `ADP`.
  - name: metabolic_pathway_state_4
    maps_to: Cr
    label: Metabolic Pathway state 4
    description: Metabolic Pathway state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Cr`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: Pi
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Pi`. Exact metabolite identity is not encoded in
      the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
