    maps_to: metabolism_sbml_poolman2004_calvincycle_biomd0000000013_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_poolman2004_calvincycle_biomd0000000013_model.metabolic_pathway_state_2
