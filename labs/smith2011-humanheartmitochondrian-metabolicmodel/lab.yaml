schema_version: '2.0'
title: Smith2011_HumanHeartMitochondrian_MetabolicModel Lab
description: 'This model is from the article: A metabolic model of the mitochondrion and its
  use in modelling diseases of the tricarboxylic acid cycle. It can be used to explore metabolic
  flux dynamics and compare pathway behavior across conditions.'
