schema_version: '2.0'
title: Smallbone2013 - Serine biosynthesis
description: 'Smallbone2013 - Serine biosynthesis Kinetic modelling of metabolic pathways
  in application to Serine biosynthesis. This model is described in the article: Kinetic Modeling
  of Metabolic Pathways: Appli.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Kieran Smallbone
- Natalie J Stanford
upstream:
  id: biomodels_ebi:BIOMD0000000458
  source_db: biomodels_ebi
  source_id: BIOMD0000000458
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000458
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000458?filename=BIOMD0000000458_url.xml
  license: CC0
biosim:
  entrypoint: src.smallbone2013_serine_biosynthesis_biomd0000000458_model:Smallbone2013SerineBiosynthesisBiomd0000000458Model
  init_kwargs:
    model_path: data/BIOMD0000000458.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_phosphohydroxypyruvate
    maps_to: php
    default: 0.6
    units: native SBML value
    description: Initial condition for phosphohydroxypyruvate. Maps to bundled SBML symbol
      `php`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_phosphoserine
    maps_to: pser
    default: 0.09
    units: native SBML value
    description: Initial condition for phosphoserine. Maps to bundled SBML symbol `pser`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: phosphohydroxypyruvate
    maps_to: php
    label: Phosphohydroxypyruvate
    description: Phosphohydroxypyruvate. Maps to SBML symbol `php`.
  - name: phosphoserine
    maps_to: pser
    label: Phosphoserine
    description: Phosphoserine. Maps to SBML symbol `pser`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
