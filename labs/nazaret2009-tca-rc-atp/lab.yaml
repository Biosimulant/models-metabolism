schema_version: '2.0'
package: nazaret2009-tca-rc-atp
version: 1.0.0
title: Nazaret2009_TCA_RC_ATP Lab
description: 'This a model from the article: Mitochondrial energetic metabolism: a simplified
  model of TCA cycle with ATP production. Nazaret C, Heiske M, Thurley K, Mazat JP J.'
io:
  inputs:
  - name: initial_atp
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.initial_atp
    default: 3.536
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_nad
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.initial_nad
    default: 0.856
    units: native SBML value
    description: Initial condition for nad. Maps to bundled SBML symbol `NAD`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_mitochondrial_energy_state_3
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.initial_mitochondrial_energy_state_3
    default: 0.063
    units: native SBML value
    description: Initial condition for mitochondrial energy state 3. Maps to bundled SBML
      symbol `AcCoA`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_alpha_ketoglutarate
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.initial_alpha_ketoglutarate
    default: 0.225
    units: native SBML value
    description: Initial condition for alpha ketoglutarate. Maps to bundled SBML symbol `KG`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_mitochondrial_energy_state_5
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.initial_mitochondrial_energy_state_5
    default: 0.44
    units: native SBML value
    description: Initial condition for mitochondrial energy state 5. Maps to bundled SBML
      symbol `Cit`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: atp
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.atp
  - name: nad
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.nad
  - name: mitochondrial_energy_state_3
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.mitochondrial_energy_state_3
  - name: alpha_ketoglutarate
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.alpha_ketoglutarate
  - name: mitochondrial_energy_state_5
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.mitochondrial_energy_state_5
  - name: observable_values
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.observable_labels
models:
- alias: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000232.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.observable_values
  to:
  - visualisation.metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_observable_values
- from: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.run_summary
  to:
  - visualisation.metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_run_summary
- from: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model.observable_labels
  to:
  - visualisation.metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
