schema_version: '2.0'
title: Nazaret2009_TCA_RC_ATP
description: 'This a model from the article: Mitochondrial energetic metabolism: a simplified
  model of TCA cycle with ATP production. Nazaret C, Heiske M, Thurley K, Mazat JP J.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Christine Nazaret
- Margit Heiske
- Kevin Thurley
- Jean-Pierre Mazat
upstream:
  id: biomodels_ebi:BIOMD0000000232
  source_db: biomodels_ebi
  source_id: BIOMD0000000232
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000232
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000232?filename=BIOMD0000000232_url.xml
  license: CC0
biosim:
  entrypoint: src.nazaret2009_tca_rc_atp_biomd0000000232_model:Nazaret2009TcaRcAtpBiomd0000000232Model
  init_kwargs:
    model_path: data/BIOMD0000000232.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_atp
    maps_to: ATP
    default: 3.536
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_nad
    maps_to: NAD
    default: 0.856
    units: native SBML value
    description: Initial condition for nad. Maps to bundled SBML symbol `NAD`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_mitochondrial_energy_state_3
    maps_to: AcCoA
    default: 0.063
    units: native SBML value
    description: Initial condition for mitochondrial energy state 3. Maps to bundled SBML
      symbol `AcCoA`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_alpha_ketoglutarate
    maps_to: KG
    default: 0.225
    units: native SBML value
    description: Initial condition for alpha ketoglutarate. Maps to bundled SBML symbol `KG`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_mitochondrial_energy_state_5
    maps_to: Cit
    default: 0.44
    units: native SBML value
    description: Initial condition for mitochondrial energy state 5. Maps to bundled SBML
      symbol `Cit`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: atp
    maps_to: ATP
    label: ATP
    description: ATP. Maps to SBML symbol `ATP`.
  - name: nad
    maps_to: NAD
    label: NAD
    description: NAD. Maps to SBML symbol `NAD`.
  - name: mitochondrial_energy_state_3
    maps_to: AcCoA
    label: Mitochondrial Energy state 3
    description: Mitochondrial Energy state 3; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `AcCoA`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: alpha_ketoglutarate
    maps_to: KG
    label: Alpha Ketoglutarate
    description: Alpha Ketoglutarate. Maps to SBML symbol `KG`.
  - name: mitochondrial_energy_state_5
    maps_to: Cit
    label: Mitochondrial Energy state 5
    description: Mitochondrial Energy state 5; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `Cit`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
