schema_version: '2.0'
title: Nazaret2009_TCA_RC_ATP Visualisation
description: Dedicated presentation model for Nazaret2009_TCA_RC_ATP.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Nazaret2009_TCA_RC_ATP Lab
    question: Which mitochondrial energy metabolism observables show the strongest activity
      in Nazaret2009_TCA_RC_ATP?
    answer_focus: mitochondrial energy metabolism
    sources:
    - alias: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model
      title: Nazaret2009_TCA_RC_ATP
      scope: mitochondrial energy metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: atp
        label: ATP
        maps_to: ATP
      - id: nad
        label: NAD
        maps_to: NAD
      - id: mitochondrial_energy_state_3
        label: Mitochondrial Energy state 3
        maps_to: AcCoA
      - id: alpha_ketoglutarate
        label: Alpha Ketoglutarate
        maps_to: KG
      - id: mitochondrial_energy_state_5
        label: Mitochondrial Energy state 5
        maps_to: Cit
      - id: oxaloacetate
        label: Oxaloacetate
        maps_to: OAA
      - id: pyruvate
        label: Pyruvate
        maps_to: Pyr
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_nazaret2009_tca_rc_atp_biomd0000000232_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
