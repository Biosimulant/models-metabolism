schema_version: '2.0'
title: Feala2007_dros_mel_central_metabolism
description: 'Model described in: Flexibility in energy metabolism supports hypoxia tolerance
  in Drosophila flight muscle: metabolomic and computational systems analysis. It can be used
  to explore metabolic flux dynamics and compare pathway behavior across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Jacob D Feala
- Laurence Coquin
- Andrew D McCulloch
- Giovanni Paternostro
upstream:
  id: biomodels_ebi:MODEL2784700357
  source_db: biomodels_ebi
  source_id: MODEL2784700357
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2784700357
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2784700357?filename=MODEL2784700357_url.xml
  license: CC0
biosim:
  entrypoint: src.feala2007_dros_mel_central_metabolism_model2784700357_model:Feala2007DrosMelCentralMetabolismModel2784700357Model
  init_kwargs:
    model_path: data/MODEL2784700357.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: M_13dpg_c
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `M_13dpg_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_metabolic_pathway_state_2
    maps_to: M_1pyr5c_m
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `M_1pyr5c_m`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_m_d_glycerate_2_phosphate_c3h4o7p
    maps_to: M_2pg_c
    default: 0.0
    units: native SBML value
    description: Initial condition for m d glycerate 2 phosphate c3h4o7p. Maps to bundled
      SBML symbol `M_2pg_c`. Applied before the Tellurium simulation starts; this does not
      change kinetic parameters or equations. Default from Tellurium setup-time value because
      no explicit SBML initial value was available.
  - name: initial_metabolic_pathway_state_4
    maps_to: M_3pg_c
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `M_3pg_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_metabolic_pathway_state_5
    maps_to: M_4abut_c
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `M_4abut_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: M_13dpg_c
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `M_13dpg_c`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: M_1pyr5c_m
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `M_1pyr5c_m`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: m_d_glycerate_2_phosphate_c3h4o7p
    maps_to: M_2pg_c
    label: M D Glycerate 2 Phosphate C3h4o7p
    description: M D Glycerate 2 Phosphate C3h4o7p. Maps to SBML symbol `M_2pg_c`.
  - name: metabolic_pathway_state_4
    maps_to: M_3pg_c
    label: Metabolic Pathway state 4
    description: Metabolic Pathway state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `M_3pg_c`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: M_4abut_c
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `M_4abut_c`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
