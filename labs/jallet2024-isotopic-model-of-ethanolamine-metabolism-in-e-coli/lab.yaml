schema_version: '2.0'
package: jallet2024-isotopic-model-of-ethanolamine-metabolism-in-e-coli
version: 1.0.0
title: Jallet2024 - Isotopic model of ethanolamine metabolism in E. coli Lab
description: Isotopic model of ethanolamine metabolism in E. It can be used to explore metabolic
  flux dynamics and compare pathway behavior across conditions.
io:
  inputs:
  - name: initial_microbial_metabolism_state_1
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.initial_microbial_metabolism_state_1
    default: 1.0
    units: native SBML value
    description: Initial condition for microbial metabolism state 1. Maps to bundled SBML
      symbol `EA_c`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_microbial_metabolism_state_2
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.initial_microbial_metabolism_state_2
    default: 1.0
    units: native SBML value
    description: Initial condition for microbial metabolism state 2. Maps to bundled SBML
      symbol `EA_eut`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_microbial_metabolism_state_3
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.initial_microbial_metabolism_state_3
    default: 1.0
    units: native SBML value
    description: Initial condition for microbial metabolism state 3. Maps to bundled SBML
      symbol `AAL_eut`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_microbial_metabolism_state_4
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.initial_microbial_metabolism_state_4
    default: 1.0
    units: native SBML value
    description: Initial condition for microbial metabolism state 4. Maps to bundled SBML
      symbol `NH4_eut`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_microbial_metabolism_state_5
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.initial_microbial_metabolism_state_5
    default: 1.0
    units: native SBML value
    description: Initial condition for microbial metabolism state 5. Maps to bundled SBML
      symbol `EtOH_eut`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: microbial_metabolism_state_1
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.microbial_metabolism_state_1
  - name: microbial_metabolism_state_2
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.microbial_metabolism_state_2
  - name: microbial_metabolism_state_3
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.microbial_metabolism_state_3
  - name: microbial_metabolism_state_4
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.microbial_metabolism_state_4
  - name: microbial_metabolism_state_5
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.microbial_metabolism_state_5
  - name: observable_values
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.observable_labels
models:
- alias: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model
  path: models/core
  parameters:
    model_path: data/MODEL2403010002.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.observable_values
  to:
  - visualisation.metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model_observable_values
- from: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.run_summary
  to:
  - visualisation.metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model_run_summary
- from: metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model.observable_labels
  to:
  - visualisation.metabolism_sbml_jallet2024_isotopic_model_of_ethanolamine_metabo_model2403010002_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
