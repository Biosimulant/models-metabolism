schema_version: '2.0'
title: Pritchard2002_glycolysis Visualisation
description: Dedicated presentation model for Pritchard2002_glycolysis.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Pritchard2002_glycolysis Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Pritchard2002_glycolysis?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model
      title: Pritchard2002_glycolysis
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: intracellular_glucose
        label: Intracellular Glucose
        maps_to: GLCi
      - id: atp
        label: ATP
        maps_to: ATP
      - id: glucose_6_phosphate
        label: glucose 6 phosphate
        maps_to: G6P
      - id: adp
        label: ADP
        maps_to: ADP
      - id: fructose_6_phosphate
        label: Fructose 6 Phosphate
        maps_to: F6P
      - id: glycolysis_state_6
        label: Glycolysis state 6
        maps_to: F16bP
      - id: amp
        label: AMP
        maps_to: AMP
      - id: glycerone_phosphate
        label: Glycerone Phosphate
        maps_to: DHAP
      - id: gra3p
        label: Gra3p
        maps_to: GAP
      - id: nad
        label: NAD
        maps_to: NAD
      - id: glycolysis_state_11
        label: Glycolysis state 11
        maps_to: BPG
      - id: nadh
        label: NADH
        maps_to: NADH
      - id: gri3p
        label: Gri3p
        maps_to: P3G
      - id: gri2p
        label: Gri2p
        maps_to: P2G
      - id: phosphoenolpyruvate
        label: Phosphoenolpyruvate
        maps_to: PEP
      - id: pyruvate
        label: Pyruvate
        maps_to: PYR
      - id: acetaldehyde
        label: Acetaldehyde
        maps_to: AcAld
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
