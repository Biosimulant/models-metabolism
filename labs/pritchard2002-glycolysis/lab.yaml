schema_version: '2.0'
package: pritchard2002-glycolysis
version: 1.0.0
title: Pritchard2002_glycolysis Lab
description: 'from: Schemes of fluc control in a model of Saccharomyces cerevisiae glycolysis
  Pritchard, L and Kell, DB Eur. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.'
io:
  inputs:
  - name: initial_intracellular_glucose
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.initial_intracellular_glucose
    default: 0.097652231064563
    units: native SBML value
    description: Initial condition for intracellular glucose. Maps to bundled SBML symbol
      `GLCi`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.initial_atp
    default: 2.52512746499271
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.initial_glucose_6_phosphate
    default: 2.67504014044787
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_adp
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.initial_adp
    default: 1.28198768168719
    units: native SBML value
    description: Initial condition for adp. Maps to bundled SBML symbol `ADP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.initial_fructose_6_phosphate
    default: 0.624976405532373
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `F6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: intracellular_glucose
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.intracellular_glucose
  - name: atp
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.atp
  - name: glucose_6_phosphate
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.glucose_6_phosphate
  - name: adp
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.adp
  - name: fructose_6_phosphate
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.fructose_6_phosphate
  - name: observable_values
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.observable_labels
models:
- alias: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000172.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.observable_values
  to:
  - visualisation.metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_observable_values
- from: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.run_summary
  to:
  - visualisation.metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_run_summary
- from: metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model.observable_labels
  to:
  - visualisation.metabolism_sbml_pritchard2002_glycolysis_biomd0000000172_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
