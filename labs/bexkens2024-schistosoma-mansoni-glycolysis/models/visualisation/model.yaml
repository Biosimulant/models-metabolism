schema_version: '2.0'
title: Bexkens2024 - Schistosoma mansoni glycolysis Visualisation
description: Dedicated presentation model for Bexkens2024 - Schistosoma mansoni glycolysis.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Bexkens2024 - Schistosoma mansoni glycolysis Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Bexkens2024 - Schistosoma mansoni glycolysis?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_bexkens2024_schistosoma_mansoni_glycolysis_model2208290002_model
      title: Bexkens2024 - Schistosoma mansoni glycolysis
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: atp
        label: ATP
        maps_to: ATP
      - id: intracellular_glucose
        label: Intracellular Glucose
        maps_to: GLCi
      - id: adp
        label: ADP
        maps_to: ADP
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: G6P
      - id: fructose_6_phosphate
        label: Fructose 6 Phosphate
        maps_to: F6P
      - id: glycolysis_state_6
        label: Glycolysis state 6
        maps_to: F16BP
      - id: triose_phosphate
        label: Triose Phosphate
        maps_to: TRIO
      - id: nad
        label: NAD
        maps_to: NAD
      - id: glycolysis_state_9
        label: Glycolysis state 9
        maps_to: BPG
      - id: nadh
        label: NADH
        maps_to: NADH
      - id: glycolysis_state_11
        label: Glycolysis state 11
        maps_to: P3G
      - id: glycolysis_state_12
        label: Glycolysis state 12
        maps_to: P2G
      - id: phosphoenolpyruvate
        label: Phosphoenolpyruvate
        maps_to: PEP
      - id: pyruvate
        label: Pyruvate
        maps_to: PYR
      - id: amp
        label: AMP
        maps_to: AMP
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_bexkens2024_schistosoma_mansoni_glycolysis_model2208290002_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_bexkens2024_schistosoma_mansoni_glycolysis_model2208290002_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_bexkens2024_schistosoma_mansoni_glycolysis_model2208290002_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
