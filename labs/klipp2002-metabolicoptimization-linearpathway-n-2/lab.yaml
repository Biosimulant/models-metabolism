    maps_to: metabolism_sbml_klipp2002_metabolicoptimization_linearpathway_n_biomd0000000104_model.initial_metabolic_pathway_state_1
    default: 1.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `species_0`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
