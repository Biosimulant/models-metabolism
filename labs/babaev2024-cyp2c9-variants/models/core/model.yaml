schema_version: '2.0'
title: Babaev2024 - CYP2C9 variants
description: Modified model of losartan metabolism (Karatza and Karalis, 2020) incorporating
  different allelic variants of CYP2C9. It can be used to explore metabolic flux dynamics
  and compare pathway behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Dmitry Babaev
- Elena Kutumova
- Fedor Kolpakov
upstream:
  id: biomodels_ebi:MODEL2412180002
  source_db: biomodels_ebi
  source_id: MODEL2412180002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2412180002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2412180002?filename=Babaev2024
    - CYP2C9 variants.xml
  license: CC0
biosim:
  entrypoint: src.babaev2024_cyp2c9_variants_model2412180002_model:Babaev2024Cyp2c9VariantsModel2412180002Model
  init_kwargs:
    model_path: data/MODEL2412180002.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_drug_metabolite_e3174
    maps_to: E3174_out
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolite e3174. Maps to bundled SBML symbol
      `E3174_out`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolite_e3174_2
    maps_to: E3174_cc
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolite e3174 2. Maps to bundled SBML symbol
      `E3174_cc`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_3
    maps_to: losartan_cc
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolism state 3. Maps to bundled SBML symbol
      `losartan_cc`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_4
    maps_to: losartan_int
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolism state 4. Maps to bundled SBML symbol
      `losartan_int`. Applied before the Tellurium simulation starts; this does not change
      kinetic parameters or equations. Default from bundled SBML initial value.
  - name: initial_drug_metabolism_state_5_extracellular
    maps_to: losartan_out
    default: 0.0
    units: native SBML value
    description: Initial condition for drug metabolism state 5 extracellular. Maps to bundled
      SBML symbol `losartan_out`. Applied before the Tellurium simulation starts; this does
      not change kinetic parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: drug_metabolite_e3174
    maps_to: E3174_out
    label: Drug metabolite E3174
    description: Drug metabolite E3174. Maps to SBML symbol `E3174_out`.
  - name: drug_metabolite_e3174_2
    maps_to: E3174_cc
    label: Drug metabolite E3174 2
    description: Drug metabolite E3174 2. Maps to SBML symbol `E3174_cc`.
  - name: drug_metabolism_state_3
    maps_to: losartan_cc
    label: Drug Metabolism state 3
    description: Drug Metabolism state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `losartan_cc`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: drug_metabolism_state_4
    maps_to: losartan_int
    label: Drug Metabolism state 4
    description: Drug Metabolism state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `losartan_int`. Exact metabolite identity is not
      encoded in the bundled SBML metadata.
  - name: drug_metabolism_state_5_extracellular
    maps_to: losartan_out
    label: Drug Metabolism state 5 extracellular
    description: Drug Metabolism state 5 extracellular; conservative display label for an
      abstract SBML state variable. Maps to SBML symbol `losartan_out`. Exact metabolite identity
      is not encoded in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
