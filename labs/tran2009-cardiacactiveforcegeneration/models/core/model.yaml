schema_version: '2.0'
title: Tran2009_CardiacActiveForceGeneration
description: 'This a model from the article: A metabolite-sensitive, thermodynamically constrained
  model of cardiaccross-bridge cycling: implications for force development during ischemia.
  It can be used to explore metabolic flux dynamics and compare pathway behavior across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Kenneth Tran
- Nicolas P Smith
- Denis S Loiselle
- Edmund J Crampin
upstream:
  id: biomodels_ebi:MODEL1006230116
  source_db: biomodels_ebi
  source_id: MODEL1006230116
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1006230116
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1006230116?filename=MODEL1006230116_url.xml
  license: CC0
biosim:
  entrypoint: src.tran2009_cardiacactiveforcegeneration_model1006230116_model:Tran2009CardiacactiveforcegenerationModel1006230116Model
  init_kwargs:
    model_path: data/MODEL1006230116.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: Ca_sr
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `Ca_sr`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: T_Cai
    default: 0.00016666666666666666
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `T_Cai`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_metabolic_pathway_state_3
    maps_to: T_Casr
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `T_Casr`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_metabolic_pathway_state_4
    maps_to: T_H1
    default: 9.174311926605505
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `T_H1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  - name: initial_metabolic_pathway_state_5
    maps_to: T_Hi
    default: 2.824858757062147e-06
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `T_Hi`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from Tellurium setup-time value because no explicit
      SBML initial value was available.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: Ca_sr
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `Ca_sr`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: T_Cai
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `T_Cai`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: T_Casr
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `T_Casr`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_4
    maps_to: T_H1
    label: Metabolic Pathway state 4
    description: Metabolic Pathway state 4; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `T_H1`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_5
    maps_to: T_Hi
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `T_Hi`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
