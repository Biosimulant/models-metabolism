  - name: metabolic_pathway_state_1
    maps_to: metabolism_sbml_hofmeyr1996_metabolic_control_analysis_model1304300000_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_hofmeyr1996_metabolic_control_analysis_model1304300000_model.metabolic_pathway_state_2
