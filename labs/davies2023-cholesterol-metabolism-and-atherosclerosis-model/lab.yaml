schema_version: '2.0'
package: davies2023-cholesterol-metabolism-and-atherosclerosis-model
version: 1.0.0
title: Davies2023 - Cholesterol Metabolism and Atherosclerosis Model Lab
description: Merged model of whole body cholesterol metabolism (BIOMD0000000434) and atherosclerosis
  (MODEL1002160000). It can be used to explore metabolic flux dynamics and compare pathway
  behavior across conditions.
io:
  inputs:
  - name: initial_lipid_metabolism_state_1
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.initial_lipid_metabolism_state_1
    default: 3150.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 1. Maps to bundled SBML symbol
      `species_2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_2
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.initial_lipid_metabolism_state_2
    default: 400.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 2. Maps to bundled SBML symbol
      `species_4`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_3
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.initial_lipid_metabolism_state_3
    default: 467.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 3. Maps to bundled SBML symbol
      `species_5`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_4
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.initial_lipid_metabolism_state_4
    default: 60000.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 4. Maps to bundled SBML symbol
      `species_7`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_lipid_metabolism_state_5
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.initial_lipid_metabolism_state_5
    default: 100.0
    units: native SBML value
    description: Initial condition for lipid metabolism state 5. Maps to bundled SBML symbol
      `species_10`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: lipid_metabolism_state_1
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.lipid_metabolism_state_1
  - name: lipid_metabolism_state_2
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.lipid_metabolism_state_2
  - name: lipid_metabolism_state_3
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.lipid_metabolism_state_3
  - name: lipid_metabolism_state_4
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.lipid_metabolism_state_4
  - name: lipid_metabolism_state_5
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.lipid_metabolism_state_5
  - name: observable_values
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.observable_labels
models:
- alias: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model
  path: models/core
  parameters:
    model_path: data/MODEL2306300001.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.observable_values
  to:
  - visualisation.metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model_observable_values
- from: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.run_summary
  to:
  - visualisation.metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model_run_summary
- from: metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model.observable_labels
  to:
  - visualisation.metabolism_sbml_davies2023_cholesterol_metabolism_and_atheroscle_model2306300001_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
