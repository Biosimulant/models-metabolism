schema_version: '2.0'
title: Teusink1998_Glycolysis_TurboDesign
description: 'This is the model described in the article: The danger of metabolic pathways
  with turbo design Teusink B, Walsh MC, van Dam K, Westerhoff HV Trends Biochem. It can be
  used to explore metabolic flux dynamics and compare pathway behavior across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- B Teusink
- M C Walsh
- K van Dam
- H V Westerhoff
upstream:
  id: biomodels_ebi:BIOMD0000000253
  source_db: biomodels_ebi
  source_id: BIOMD0000000253
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000253
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000253?filename=BIOMD0000000253_url.xml
  license: CC0
biosim:
  entrypoint: src.teusink1998_glycolysis_turbodesign_biomd0000000253_model:Teusink1998GlycolysisTurbodesignBiomd0000000253Model
  init_kwargs:
    model_path: data/BIOMD0000000253.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_hexose_monophosphate
    maps_to: HMP
    default: 0.1
    units: native SBML value
    description: Initial condition for hexose monophosphate. Maps to bundled SBML symbol `HMP`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_1_6_bisphosphate
    maps_to: Fru16P2
    default: 1.0
    units: native SBML value
    description: Initial condition for fructose 1 6 bisphosphate. Maps to bundled SBML symbol
      `Fru16P2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: ATP
    default: 4.0
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  outputs:
  - name: hexose_monophosphate
    maps_to: HMP
    label: Hexose Monophosphate
    description: Hexose Monophosphate. Maps to SBML symbol `HMP`.
  - name: fructose_1_6_bisphosphate
    maps_to: Fru16P2
    label: Fructose 1 6 Bisphosphate
    description: Fructose 1 6 Bisphosphate. Maps to SBML symbol `Fru16P2`.
  - name: atp
    maps_to: ATP
    label: ATP
    description: ATP. Maps to SBML symbol `ATP`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
