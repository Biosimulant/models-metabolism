schema_version: '2.0'
title: Noguchi2013 - Insulin dependent glucose metabolism Visualisation
description: Dedicated presentation model for Noguchi2013 - Insulin dependent glucose metabolism.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Noguchi2013 - Insulin dependent glucose metabolism Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Noguchi2013 - Insulin dependent glucose metabolism?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_noguchi2013_insulin_dependent_glucose_metabolism_biomd0000000482_model
      title: Noguchi2013 - Insulin dependent glucose metabolism
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: glycolysis_state_1
        label: Glycolysis state 1
        maps_to: GP
      - id: glycolysis_state_2
        label: Glycolysis state 2
        maps_to: pGP
      - id: mitochondrial_rna
        label: Mitochondrial RNA
        maps_to: mRNA
      - id: glycolysis_state_4
        label: Glycolysis state 4
        maps_to: PEPCK
      - id: glycolysis_state_5
        label: Glycolysis state 5
        maps_to: IRS
      - id: glycolysis_state_6
        label: Glycolysis state 6
        maps_to: p1IRS
      - id: glycolysis_state_7
        label: Glycolysis state 7
        maps_to: p2IRS
      - id: glycolysis_state_8
        label: Glycolysis state 8
        maps_to: p1p2IRS
      - id: glycolysis_state_9
        label: Glycolysis state 9
        maps_to: Akt
      - id: glycolysis_state_10
        label: Glycolysis state 10
        maps_to: pAkt
      - id: glycolysis_state_11
        label: Glycolysis state 11
        maps_to: mTOR
      - id: glycolysis_state_12
        label: Glycolysis state 12
        maps_to: pmTOR
      - id: glycolysis_state_13
        label: Glycolysis state 13
        maps_to: Foxo
      - id: glycolysis_state_14
        label: Glycolysis state 14
        maps_to: pFoxo
      - id: extracellular_pyruvate
        label: Extracellular Pyruvate
        maps_to: PYRout
      - id: glycolysis_state_16
        label: Glycolysis state 16
        maps_to: GLCex
      - id: fructose_1_6_bisphosphate
        label: Fructose 1 6 Bisphosphate
        maps_to: F16P
      - id: intracellular_pyruvate
        label: Intracellular Pyruvate
        maps_to: PYRin
      - id: lactate
        label: Lactate
        maps_to: LAC
      - id: glycolysis_state_20
        label: Glycolysis state 20
        maps_to: OAA
      - id: glycolysis_state_21
        label: Glycolysis state 21
        maps_to: GLY
      - id: glycolysis_state_22
        label: Glycolysis state 22
        maps_to: G1P
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: G6P
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_noguchi2013_insulin_dependent_glucose_metabolism_biomd0000000482_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_noguchi2013_insulin_dependent_glucose_metabolism_biomd0000000482_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_noguchi2013_insulin_dependent_glucose_metabolism_biomd0000000482_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
