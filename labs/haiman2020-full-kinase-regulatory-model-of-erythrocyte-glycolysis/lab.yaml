schema_version: '2.0'
title: Haiman2020 - Full Kinase Regulatory Model of Erythrocyte Glycolysis Lab
description: Dynamic model utilizing mass action kinetics to elucidate network-level effects
  of allosteric regulation in erythrocyte metabolism. The full kinase regulatory model includes
  the glycolytic pathway, th.
