schema_version: '2.0'
title: Teusink2000_Glycolysis Visualisation
description: Dedicated presentation model for Teusink2000_Glycolysis.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Teusink2000_Glycolysis Lab
    question: Which central carbon and glycolytic metabolism observables show the strongest
      activity in Teusink2000_Glycolysis?
    answer_focus: central carbon and glycolytic metabolism
    sources:
    - alias: metabolism_sbml_teusink2000_glycolysis_biomd0000000064_model
      title: Teusink2000_Glycolysis
      scope: central carbon and glycolytic metabolism
      label_caveat: Values are native SBML quantities. The bundled SBML is executed directly
        and equations were not rewritten.
      observables:
      - id: glucose_in_cytosol
        label: Glucose In Cytosol
        maps_to: GLCi
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: G6P
      - id: fructose_6_phosphate
        label: Fructose 6 Phosphate
        maps_to: F6P
      - id: fructose_1_6_bisphosphate
        label: Fructose 1 6 Bisphosphate
        maps_to: F16P
      - id: triose_phosphate
        label: Triose Phosphate
        maps_to: TRIO
      - id: observable_1_3_bisphosphoglycerate
        label: 1 3 Bisphosphoglycerate
        maps_to: BPG
      - id: observable_3_phosphoglycerate
        label: 3 Phosphoglycerate
        maps_to: P3G
      - id: observable_2_phosphoglycerate
        label: 2 Phosphoglycerate
        maps_to: P2G
      - id: phosphoenolpyruvate
        label: Phosphoenolpyruvate
        maps_to: PEP
      - id: pyruvate
        label: Pyruvate
        maps_to: PYR
      - id: acetaldehyde
        label: Acetaldehyde
        maps_to: ACE
      - id: high_energy_phosphates
        label: High Energy Phosphates
        maps_to: P
      - id: nad
        label: NAD
        maps_to: NAD
      - id: nadh
        label: NADH
        maps_to: NADH
      - id: atp_concentration
        label: ATP Concentration
        maps_to: ATP
      - id: adp_concentration
        label: ADP Concentration
        maps_to: ADP
      - id: amp_concentration
        label: AMP Concentration
        maps_to: AMP
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_teusink2000_glycolysis_biomd0000000064_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_teusink2000_glycolysis_biomd0000000064_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_teusink2000_glycolysis_biomd0000000064_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
