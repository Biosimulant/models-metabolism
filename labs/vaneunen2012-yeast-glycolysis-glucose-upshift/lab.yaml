schema_version: '2.0'
package: vaneunen2012-yeast-glycolysis-glucose-upshift
version: 1.0.0
title: vanEunen2012 - Yeast Glycolysis (glucose upshift) Lab
description: 'This is corresponding to the model of yeast glycolysis ''glucose upshift'' condition
  described in the paper ''Testing Biochemistry Revisited: How In Vivo Metabolism Can Be Understood
  from In Vitro Enzyme. It can be used to explore metabolic flux dynamics and compare pathway
  behavior across conditions.'
io:
  inputs:
  - name: initial_intracellular_glucose
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.initial_intracellular_glucose
    default: 0.0576023
    units: native SBML value
    description: Initial condition for intracellular glucose. Maps to bundled SBML symbol
      `species_1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.initial_glucose_6_phosphate
    default: 0.121566
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `species_2`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.initial_fructose_6_phosphate
    default: 0.0263653
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `species_3`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_1_6_bisphosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.initial_fructose_1_6_bisphosphate
    default: 0.0928847
    units: native SBML value
    description: Initial condition for fructose 1 6 bisphosphate. Maps to bundled SBML symbol
      `species_4`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_triose_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.initial_triose_phosphate
    default: 0.336706
    units: native SBML value
    description: Initial condition for triose phosphate. Maps to bundled SBML symbol `species_5`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: intracellular_glucose
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.intracellular_glucose
  - name: glucose_6_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.glucose_6_phosphate
  - name: fructose_6_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.fructose_6_phosphate
  - name: fructose_1_6_bisphosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.fructose_1_6_bisphosphate
  - name: triose_phosphate
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.triose_phosphate
  - name: observable_values
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.observable_labels
models:
- alias: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model
  path: models/core
  parameters:
    model_path: data/MODEL1403250001.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.observable_values
  to:
  - visualisation.metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model_observable_values
- from: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.run_summary
  to:
  - visualisation.metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model_run_summary
- from: metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model.observable_labels
  to:
  - visualisation.metabolism_sbml_vaneunen2012_yeast_glycolysis_glucose_upshift_model1403250001_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
