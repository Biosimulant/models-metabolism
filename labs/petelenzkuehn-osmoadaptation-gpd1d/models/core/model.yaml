schema_version: '2.0'
title: PetelenzKuehn_osmoadaptation_gpd1D
description: 'Petelenz-kurdzeil2013 - Osmo adaptationgpd1D This model is described in the
  article: Quantitative analysis of glycerol accumulation, glycolysis and growth under hyper
  osmotic stress. It can be used to explore metabolic flux dynamics and compare pathway behavior
  across conditions.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Elzbieta Petelenz-Kurdziel
- Clemens Kuehn
- Bodil Nordlander
- Dagmara Klein
- Kuk-Ki Hong
upstream:
  id: biomodels_ebi:BIOMD0000000610
  source_db: biomodels_ebi
  source_id: BIOMD0000000610
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000610
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000610?filename=BIOMD0000000610_url.xml
  license: CC0
biosim:
  entrypoint: src.petelenzkuehn_osmoadaptation_gpd1d_biomd0000000610_model:PetelenzkuehnOsmoadaptationGpd1dBiomd0000000610Model
  init_kwargs:
    model_path: data/BIOMD0000000610.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: glycerol_i
    default: 0.112096
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `glycerol_i`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: cin
    default: 0.651922
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `cin`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: glucose_i
    default: 2.77983
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `glucose_i`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 1.37587
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: trehalose
    default: 0.00309562
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `trehalose`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: glycerol_i
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `glycerol_i`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: cin
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `cin`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: glucose_i
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `glucose_i`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: metabolic_pathway_state_5
    maps_to: trehalose
    label: Metabolic Pathway state 5
    description: Metabolic Pathway state 5; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `trehalose`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
