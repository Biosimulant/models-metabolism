schema_version: '2.0'
title: Costa2014 - Computational Model of L. lactis Metabolism
description: 'Costa2014 - Computational Model of L. lactisMetabolism This model is described
  in the article: An extended dynamic model of Lactococcus lactis metabolism for mannitol
  and 2,3-butanediol production.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Rafael S Costa
- Andras Hartmann
- Paula Gaspar
- Ana R Neves
- Susana Vinga
upstream:
  id: biomodels_ebi:BIOMD0000000572
  source_db: biomodels_ebi
  source_id: BIOMD0000000572
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000572
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000572?filename=BIOMD0000000572_url.xml
  license: CC0
biosim:
  entrypoint: src.costa2014_computational_model_of_l_lactis_metabo_biomd0000000572_model:Costa2014ComputationalModelOfLLactisMetaboBiomd0000000572Model
  init_kwargs:
    model_path: data/BIOMD0000000572.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 0.0
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: ATP
    default: 4.88632508879394
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `ATP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_adp
    maps_to: ADP
    default: 20.3856905308319
    units: native SBML value
    description: Initial condition for adp. Maps to bundled SBML symbol `ADP`. Applied before
      the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_inorganic_phosphate
    maps_to: Pint
    default: 38.26
    units: native SBML value
    description: Initial condition for inorganic phosphate. Maps to bundled SBML symbol `Pint`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: F6P
    default: 0.0
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `F6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  outputs:
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: atp
    maps_to: ATP
    label: ATP
    description: ATP. Maps to SBML symbol `ATP`.
  - name: adp
    maps_to: ADP
    label: ADP
    description: ADP. Maps to SBML symbol `ADP`.
  - name: inorganic_phosphate
    maps_to: Pint
    label: Inorganic Phosphate
    description: Inorganic Phosphate. Maps to SBML symbol `Pint`.
  - name: fructose_6_phosphate
    maps_to: F6P
    label: Fructose 6 Phosphate
    description: Fructose 6 Phosphate. Maps to SBML symbol `F6P`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
