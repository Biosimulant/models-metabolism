schema_version: '2.0'
title: Babaev2025 - CYP2C9 and ABCB1 losartan metabolism model Visualisation
description: Dedicated presentation model for Babaev2025 - CYP2C9 and ABCB1 losartan metabolism
  model.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Babaev2025 - CYP2C9 and ABCB1 losartan metabolism model Lab
    question: Which drug and xenobiotic metabolism observables show the strongest activity
      in Babaev2025 - CYP2C9 and ABCB1 losartan metabolism model?
    answer_focus: drug and xenobiotic metabolism
    sources:
    - alias: metabolism_sbml_babaev2025_cyp2c9_and_abcb1_losartan_metabolism_model2504020001_model
      title: Babaev2025 - CYP2C9 and ABCB1 losartan metabolism model
      scope: drug and xenobiotic metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: losartan_metabolite_e3174
        label: Losartan metabolite E3174
        maps_to: E3174_out
      - id: losartan_metabolite_e3174_2
        label: Losartan metabolite E3174 2
        maps_to: E3174_cc
      - id: drug_metabolism_state_3
        label: Drug Metabolism state 3
        maps_to: losartan_cc
      - id: drug_metabolism_state_4
        label: Drug Metabolism state 4
        maps_to: losartan_ent
      - id: drug_metabolism_state_5
        label: Drug Metabolism state 5
        maps_to: losartan_int
      - id: drug_metabolism_state_6_extracellular
        label: Drug Metabolism state 6 extracellular
        maps_to: losartan_out
      - id: drug_metabolism_state_7
        label: Drug Metabolism state 7
        maps_to: losartan_pc
      - id: drug_metabolism_state_8
        label: Drug Metabolism state 8
        maps_to: losartan_stm
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_babaev2025_cyp2c9_and_abcb1_losartan_metabolism_model2504020001_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_babaev2025_cyp2c9_and_abcb1_losartan_metabolism_model2504020001_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_babaev2025_cyp2c9_and_abcb1_losartan_metabolism_model2504020001_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
