schema_version: '2.0'
title: Adams2019 - The regulatory role of shikimate in plant phenylalanine metabolism
description: This is a mathematical model of phenylalanine metabolism in plants as influenced
  by shikimate, with specific evidence of how shikimate dynamics influence phenylalanine metabolism
  as a function of phen. It can be used to explore metabolic flux dynamics and compare pathway
  behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Z P Adams
- J Ehlting
- R Edwards
upstream:
  id: biomodels_ebi:BIOMD0000000847
  source_db: biomodels_ebi
  source_id: BIOMD0000000847
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000847
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000847?filename=Adams2019.xml
  license: CC0
biosim:
  entrypoint: src.adams2019_the_regulatory_role_of_shikimate_in_pl_biomd0000000847_model:Adams2019TheRegulatoryRoleOfShikimateInPlBiomd0000000847Model
  init_kwargs:
    model_path: data/BIOMD0000000847.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_phenylalanine_pathway_state_1
    maps_to: X_1
    default: 0.0
    units: native SBML value
    description: Initial condition for phenylalanine pathway state 1. Maps to bundled SBML
      symbol `X_1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_phenylalanine_pathway_state_2
    maps_to: X_2
    default: 0.0
    units: native SBML value
    description: Initial condition for phenylalanine pathway state 2. Maps to bundled SBML
      symbol `X_2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_phenylalanine_pathway_state_3
    maps_to: X_3
    default: 0.0
    units: native SBML value
    description: Initial condition for phenylalanine pathway state 3. Maps to bundled SBML
      symbol `X_3`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_phenylalanine_pathway_state_4
    maps_to: X_4
    default: 0.0
    units: native SBML value
    description: Initial condition for phenylalanine pathway state 4. Maps to bundled SBML
      symbol `X_4`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: phenylalanine_pathway_state_1
    maps_to: X_1
    label: Phenylalanine Pathway state 1
    description: Phenylalanine Pathway state 1; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `X_1`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: phenylalanine_pathway_state_2
    maps_to: X_2
    label: Phenylalanine Pathway state 2
    description: Phenylalanine Pathway state 2; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `X_2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: phenylalanine_pathway_state_3
    maps_to: X_3
    label: Phenylalanine Pathway state 3
    description: Phenylalanine Pathway state 3; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `X_3`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: phenylalanine_pathway_state_4
    maps_to: X_4
    label: Phenylalanine Pathway state 4
    description: Phenylalanine Pathway state 4; conservative display label for an abstract
      SBML state variable. Maps to SBML symbol `X_4`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
