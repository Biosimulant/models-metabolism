runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_adams2019_the_regulatory_role_of_shikimate_in_pl_biomd0000000847_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_adams2019_the_regulatory_role_of_shikimate_in_pl_biomd0000000847_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_adams2019_the_regulatory_role_of_shikimate_in_pl_biomd0000000847_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
