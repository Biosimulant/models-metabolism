schema_version: '2.0'
title: Adams2019 - The regulatory role of shikimate in plant phenylalanine metabolism Visualisation
description: Dedicated presentation model for Adams2019 - The regulatory role of shikimate
  in plant phenylalanine metabolism.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
