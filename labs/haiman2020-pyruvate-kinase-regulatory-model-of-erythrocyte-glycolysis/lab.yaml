schema_version: '2.0'
title: Haiman2020 - Pyruvate Kinase Regulatory Model of Erythrocyte Glycolysis Lab
description: Dynamic model utilizing mass action kinetics to elucidate network-level effects
  of allosteric regulation in erythrocyte metabolism. The pyruvate kinase regulatory model
  includes the glycolytic pathway.
io:
  inputs:
  - name: initial_d_glucose
    maps_to: metabolism_sbml_haiman2020_pyruvate_kinase_regulatory_model_of_e_model2012150002_model.initial_d_glucose
    default: 1.24081917841505
    units: native SBML value
    description: Initial condition for d glucose. Maps to bundled SBML symbol `M_glc__D_c`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_d_glucose_6_phosphate
    maps_to: metabolism_sbml_haiman2020_pyruvate_kinase_regulatory_model_of_e_model2012150002_model.initial_d_glucose_6_phosphate
    default: 0.0602185259654985
    units: native SBML value
    description: Initial condition for d glucose 6 phosphate. Maps to bundled SBML symbol
      `M_g6p_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_d_fructose_6_phosphate
    maps_to: metabolism_sbml_haiman2020_pyruvate_kinase_regulatory_model_of_e_model2012150002_model.initial_d_fructose_6_phosphate
    default: 0.0245635954921956
    units: native SBML value
    description: Initial condition for d fructose 6 phosphate. Maps to bundled SBML symbol
      `M_f6p_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_d_fructose_1_6_bisphosphate
    maps_to: metabolism_sbml_haiman2020_pyruvate_kinase_regulatory_model_of_e_model2012150002_model.initial_d_fructose_1_6_bisphosphate
    default: 0.00923798760373767
    units: native SBML value
    description: Initial condition for d fructose 1 6 bisphosphate. Maps to bundled SBML symbol
      `M_fdp_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_dihydroxyacetone_phosphate
    maps_to: metabolism_sbml_haiman2020_pyruvate_kinase_regulatory_model_of_e_model2012150002_model.initial_dihydroxyacetone_phosphate
    default: 0.130120897020308
    units: native SBML value
    description: Initial condition for dihydroxyacetone phosphate. Maps to bundled SBML symbol
      `M_dhap_c`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
