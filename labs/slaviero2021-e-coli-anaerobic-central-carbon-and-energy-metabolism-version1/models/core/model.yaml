schema_version: '2.0'
title: Slaviero2021 - E. coli anaerobic central carbon and energy metabolism_Version1
description: 'This model describes the central carbon and energy metabolism of E. coli growing
  under anaerobic conditions.For complete information about the model see: ''Deciphering the
  physiological response of Esc.'
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Boecker S
- Giulia Slaviero
- Schramm T
- Szymanski W
- Steuer R
upstream:
  id: biomodels_ebi:MODEL2202020001
  source_db: biomodels_ebi
  source_id: MODEL2202020001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2202020001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2202020001?filename=Slaviero2021-E
    coli anaerobic metabolism.xml
  license: CC0
biosim:
  entrypoint: src.slaviero2021_e_coli_anaerobic_central_carbon_and_model2202020001_model:Slaviero2021EColiAnaerobicCentralCarbonAndModel2202020001Model
  init_kwargs:
    model_path: data/MODEL2202020001.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glucose_6_phosphate
    maps_to: G6P
    default: 2.0
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `G6P`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_bisphosphate
    maps_to: FBP
    default: 3.0
    units: native SBML value
    description: Initial condition for fructose bisphosphate. Maps to bundled SBML symbol
      `FBP`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_glyceraldehyde_3_phosphate
    maps_to: GAP
    default: 0.5
    units: native SBML value
    description: Initial condition for glyceraldehyde 3 phosphate. Maps to bundled SBML symbol
      `GAP`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_phosphoenolpyruvate
    maps_to: PEP
    default: 1.0
    units: native SBML value
    description: Initial condition for phosphoenolpyruvate. Maps to bundled SBML symbol `PEP`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_pyruvate
    maps_to: PYR
    default: 1.0
    units: native SBML value
    description: Initial condition for pyruvate. Maps to bundled SBML symbol `PYR`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  outputs:
  - name: glucose_6_phosphate
    maps_to: G6P
    label: Glucose 6 Phosphate
    description: Glucose 6 Phosphate. Maps to SBML symbol `G6P`.
  - name: fructose_bisphosphate
    maps_to: FBP
    label: Fructose Bisphosphate
    description: Fructose Bisphosphate. Maps to SBML symbol `FBP`.
  - name: glyceraldehyde_3_phosphate
    maps_to: GAP
    label: Glyceraldehyde 3 Phosphate
    description: Glyceraldehyde 3 Phosphate. Maps to SBML symbol `GAP`.
  - name: phosphoenolpyruvate
    maps_to: PEP
    label: Phosphoenolpyruvate
    description: Phosphoenolpyruvate. Maps to SBML symbol `PEP`.
  - name: pyruvate
    maps_to: PYR
    label: Pyruvate
    description: Pyruvate. Maps to SBML symbol `PYR`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
