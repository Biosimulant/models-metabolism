    units: native SBML value
    description: Initial condition for vitamin a metabolism state 4. Maps to bundled SBML
      symbol `M_5`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_vitamin_a_metabolism_state_5
