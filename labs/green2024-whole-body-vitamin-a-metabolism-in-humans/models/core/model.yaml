schema_version: '2.0'
title: Green2024 - whole-body vitamin A metabolism in humans
description: Metabolism Green2024Whole Body Vitamin AMetabolism In Hum Model2411290001Model
  models core biological dynamics as a OTHER simulation curated from biomodels_ebi (biomodels_ebi:MODEL2411290001),
  focused on metabo. When you run it, you can track state over time and compare response patterns
  across parameter settings.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Michael H Green
upstream:
