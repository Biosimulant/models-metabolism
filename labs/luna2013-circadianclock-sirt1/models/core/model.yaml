schema_version: '2.0'
title: Luna2013_CircadianClock_SIRT1
description: An in silico model to examine damage-induced circadian phase shifts by investigating
  a possible mechanism linking circadian rhythms to metabolism. The proposed model involves
  two DNA damage response p.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Augustin Luna
- Geoffrey B McFadden
- Mirit I Aladjem
- Kurt W Kohn
upstream:
  id: biomodels_ebi:MODEL2112310002
  source_db: biomodels_ebi
  source_id: MODEL2112310002
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2112310002
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2112310002?filename=pcbi.1004144.s001.xml
  license: CC0
biosim:
  entrypoint: src.luna2013_circadianclock_sirt1_model2112310002_model:Luna2013CircadianclockSirt1Model2112310002Model
  init_kwargs:
    model_path: data/MODEL2112310002.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: species_1
    default: 1.54597010260715
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `species_1`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: species_2
    default: 0.101793613432364
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `species_2`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: species_3
    default: 0.0723157888573554
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `species_3`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_cp2
    maps_to: species_4
    default: 0.0475926846633792
    units: native SBML value
    description: Initial condition for cp2. Maps to bundled SBML symbol `species_4`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_nad
    maps_to: species_5
    default: 5.20806131539501
    units: native SBML value
    description: Initial condition for nad. Maps to bundled SBML symbol `species_5`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: species_1
    label: Metabolic Pathway state 1
    description: Metabolic Pathway state 1; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_1`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_2
    maps_to: species_2
    label: Metabolic Pathway state 2
    description: Metabolic Pathway state 2; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_2`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: metabolic_pathway_state_3
    maps_to: species_3
    label: Metabolic Pathway state 3
    description: Metabolic Pathway state 3; conservative display label for an abstract SBML
      state variable. Maps to SBML symbol `species_3`. Exact metabolite identity is not encoded
      in the bundled SBML metadata.
  - name: cp2
    maps_to: species_4
    label: Cp2
    description: Cp2. Maps to SBML symbol `species_4`.
  - name: nad
    maps_to: species_5
    label: NAD
    description: NAD. Maps to SBML symbol `species_5`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
