schema_version: '2.0'
title: Bertram2004_PancreaticBetaCell_modelB Visualisation
description: Dedicated presentation model for Bertram2004_PancreaticBetaCell_modelB.
standard: other
tags:
- metabolism
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.metabolism_visualisation:MetabolismVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Bertram2004_PancreaticBetaCell_modelB Lab
    question: Which pancreatic beta-cell metabolism observables show the strongest activity
      in Bertram2004_PancreaticBetaCell_modelB?
    answer_focus: pancreatic beta-cell metabolism
    sources:
    - alias: metabolism_sbml_bertram2004_pancreaticbetacell_modelb_biomd0000000373_model
      title: Bertram2004_PancreaticBetaCell_modelB
      scope: pancreatic beta-cell metabolism
      label_caveat: Values are native SBML quantities. Conservative pathway-state labels are
        used where the bundled SBML does not encode exact metabolite identities.
      observables:
      - id: pancreatic_metabolism_state_1
        label: Pancreatic Metabolism state 1
        maps_to: V
      - id: pancreatic_metabolism_state_2
        label: Pancreatic Metabolism state 2
        maps_to: n
      - id: pancreatic_metabolism_state_3
        label: Pancreatic Metabolism state 3
        maps_to: c
      - id: pancreatic_metabolism_state_4
        label: Pancreatic Metabolism state 4
        maps_to: cer
      - id: glucose_6_phosphate
        label: Glucose 6 Phosphate
        maps_to: g6p
      - id: fructose_bisphosphate
        label: Fructose Bisphosphate
        maps_to: fbp
      - id: adp
        label: ADP
        maps_to: adp
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: metabolism_sbml_bertram2004_pancreaticbetacell_modelb_biomd0000000373_model_observable_values
    description: Latest user-facing observable values from the core metabolism model.
  - name: metabolism_sbml_bertram2004_pancreaticbetacell_modelb_biomd0000000373_model_run_summary
    description: Run summary from the core metabolism model.
  - name: metabolism_sbml_bertram2004_pancreaticbetacell_modelb_biomd0000000373_model_observable_labels
    description: Display labels for user-facing observables.
  outputs: []
