schema_version: '2.0'
title: Mosca2012 - Central Carbon Metabolism Regulated by AKT
description: Mosca2012 - Central Carbon Metabolism Regulated by AKT The role of the PI3K/Akt/PKB
  signalling pathway in oncogenesis has been extensively investigated and altered expression
  or mutations of many comp. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.
standard: sbml
tags:
- biomodels_ebi
- faithful
- metabolism
- ode
- sbml
- tellurium
authors:
- Biosimulant Team
- Ettore Mosca
- Roberta Alfieri
- Carlo Maj
- Annamaria Bevilacqua
- Gianfranco Canti
upstream:
  id: biomodels_ebi:BIOMD0000000426
  source_db: biomodels_ebi
  source_id: BIOMD0000000426
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000426
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000426?filename=BIOMD0000000426_url.xml
  license: CC0
biosim:
  entrypoint: src.mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model:Mosca2012CentralCarbonMetabolismRegulatedByBiomd0000000426Model
  init_kwargs:
    model_path: data/BIOMD0000000426.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_glucose
    maps_to: species_1
    default: 0.000897
    units: native SBML value
    description: Initial condition for glucose. Maps to bundled SBML symbol `species_1`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: species_2
    default: 0.00109
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `species_2`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: species_4
    default: 0.0087
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `species_4`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
    maps_to: species_5
    default: 3.62e-05
    units: native SBML value
    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `species_5`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_1_6_bisphosphate
    maps_to: species_6
    default: 0.000367
    units: native SBML value
    description: Initial condition for fructose 1 6 bisphosphate. Maps to bundled SBML symbol
      `species_6`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: glucose
    maps_to: species_1
    label: glucose
    description: glucose. Maps to SBML symbol `species_1`.
  - name: glucose_6_phosphate
    maps_to: species_2
    label: glucose 6 phosphate
    description: glucose 6 phosphate. Maps to SBML symbol `species_2`.
  - name: atp
    maps_to: species_4
    label: ATP
    description: ATP. Maps to SBML symbol `species_4`.
  - name: fructose_6_phosphate
    maps_to: species_5
    label: fructose 6 phosphate
    description: fructose 6 phosphate. Maps to SBML symbol `species_5`.
  - name: fructose_1_6_bisphosphate
    maps_to: species_6
    label: fructose 1 6 bisphosphate
    description: fructose 1 6 bisphosphate. Maps to SBML symbol `species_6`.
  - name: observable_values
    description: Latest user-facing observable values from the SBML run.
  - name: run_summary
    description: Largest-change and peak summary across simulated SBML observables.
  - name: observable_labels
    description: Mapping from user-facing observable ports to display labels.
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal sampling step for Tellurium output collection.
