schema_version: '2.0'
title: Mosca2012 - Central Carbon Metabolism Regulated by AKT Lab
description: Mosca2012 - Central Carbon Metabolism Regulated by AKT The role of the PI3K/Akt/PKB
  signalling pathway in oncogenesis has been extensively investigated and altered expression
  or mutations of many comp. It can be used to explore metabolic flux dynamics and compare
  pathway behavior across conditions.
io:
