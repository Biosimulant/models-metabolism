  - name: glucose
    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.glucose
  - name: glucose_6_phosphate
    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.glucose_6_phosphate
