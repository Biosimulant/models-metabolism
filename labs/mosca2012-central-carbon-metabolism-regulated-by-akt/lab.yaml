    description: Initial condition for fructose 6 phosphate. Maps to bundled SBML symbol `species_5`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_fructose_1_6_bisphosphate
    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.initial_fructose_1_6_bisphosphate
    default: 0.000367
