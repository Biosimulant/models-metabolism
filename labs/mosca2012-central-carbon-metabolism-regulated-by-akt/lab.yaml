    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.initial_glucose
    default: 0.000897
    units: native SBML value
    description: Initial condition for glucose. Maps to bundled SBML symbol `species_1`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_glucose_6_phosphate
    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.initial_glucose_6_phosphate
    default: 0.00109
    units: native SBML value
    description: Initial condition for glucose 6 phosphate. Maps to bundled SBML symbol `species_2`.
      Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_atp
    maps_to: metabolism_sbml_mosca2012_central_carbon_metabolism_regulated_by_biomd0000000426_model.initial_atp
    default: 0.0087
    units: native SBML value
    description: Initial condition for atp. Maps to bundled SBML symbol `species_4`. Applied
      before the Tellurium simulation starts; this does not change kinetic parameters or equations.
      Default from bundled SBML initial value.
  - name: initial_fructose_6_phosphate
