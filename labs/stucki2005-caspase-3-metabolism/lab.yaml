schema_version: '2.0'
title: Stucki2005 - caspase-3 metabolism Lab
description: "J\xF6rg W. It can be used to explore metabolic flux dynamics and compare pathway\
  \ behavior across conditions."
io:
  inputs:
  - name: initial_metabolic_pathway_state_1
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.initial_metabolic_pathway_state_1
    default: 0.1
    units: native SBML value
    description: Initial condition for metabolic pathway state 1. Maps to bundled SBML symbol
      `pc3`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_2
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.initial_metabolic_pathway_state_2
    default: 0.710362
    units: native SBML value
    description: Initial condition for metabolic pathway state 2. Maps to bundled SBML symbol
      `c3`. Applied before the Tellurium simulation starts; this does not change kinetic parameters
      or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_3
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.initial_metabolic_pathway_state_3
    default: 0.3
    units: native SBML value
    description: Initial condition for metabolic pathway state 3. Maps to bundled SBML symbol
      `iap`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_4
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.initial_metabolic_pathway_state_4
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 4. Maps to bundled SBML symbol
      `survivin`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  - name: initial_metabolic_pathway_state_5
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.initial_metabolic_pathway_state_5
    default: 0.0
    units: native SBML value
    description: Initial condition for metabolic pathway state 5. Maps to bundled SBML symbol
      `cascade`. Applied before the Tellurium simulation starts; this does not change kinetic
      parameters or equations. Default from bundled SBML initial value.
  outputs:
  - name: metabolic_pathway_state_1
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.metabolic_pathway_state_1
  - name: metabolic_pathway_state_2
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.metabolic_pathway_state_2
  - name: metabolic_pathway_state_3
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.metabolic_pathway_state_3
  - name: metabolic_pathway_state_4
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.metabolic_pathway_state_4
  - name: metabolic_pathway_state_5
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.metabolic_pathway_state_5
  - name: observable_values
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.observable_values
  - name: run_summary
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.run_summary
  - name: observable_labels
    maps_to: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.observable_labels
models:
- alias: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000001059.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.observable_values
  to:
  - visualisation.metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model_observable_values
- from: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.run_summary
  to:
  - visualisation.metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model_run_summary
- from: metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model.observable_labels
  to:
  - visualisation.metabolism_sbml_stucki2005_caspase_3_metabolism_biomd0000001059_model_observable_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
